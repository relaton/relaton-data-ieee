abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2012 adds 100 Gb/s Physical Layer (PHY)
    specifications and management parameters for operation on electrical backplanes
    and twinaxial copper cables. This amendment also specifies optional Energy Efficient
    Ethernet (EEE) for 40 Gb/s and 100 Gb/s operation over electrical backplanes and
    copper cables.
