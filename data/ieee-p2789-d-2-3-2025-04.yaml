abstract:
- language: en
  script: Latn
  content: Cable requirements for enclosed transit infrastructure in the USA and Canada
    are explained in this guide. Public underground systems for passenger transport,
    such as metro tunnels and stations, are the primary focus. The adoption of the
    NFPA 130-2023 standard by transit authorities and wire and cable requirements
    for different applications is discussed. Open/aboveground transit infrastructure,
    rolling stock, or railway vehicles are not addressed in this guide. Considerations
    by NFPA 130-2023 for flame propagation, smoke release, and circuit-integrity are
    detailed. Various cable types, including general purpose, fire-resistive, train
    signaling, traction power, communication, and antenna cables are discussed. Emphasis
    is placed on compliance with Nationally Recognized Testing Laboratory (NRTL) listings
    such as wet ratings, conductor temperature ratings, and flame propagation standards.
