abstract:
- language: en
  script: Latn
  content: 'This standard specifies technical requirements, testing methods, and application
    specifications for Hydrogen-Powered Unmanned Aerial System (UAS). It covers three
    key technical areas: Hydrogen-powered cell materials, Hydrogen-powered technology
    equipment, and multi-rotor UAS integration, including core technical indicators
    such as material properties, hydrogen storage systems, refueling facilities, flight
    performance, and safety monitoring. The standard sets performance requirements
    for hydrogen-powered multi-rotor UAS, including environmental adaptability, dynamic
    response, and energy conversion efficiency, while standardizing technical parameters
    for three hydrogen storage methods: high-pressure gaseous, liquid, and solid-state
    hydrogen storage. It also clarifies implementation requirements for hydrogen refueling
    station construction, data monitoring, and typical application scenarios, providing
    a technical basis for the safe application of hydrogen-powered UAS in fields such
    as agriculture, power line inspection, and island operations.'
