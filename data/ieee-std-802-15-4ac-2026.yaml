abstract:
- language: en
  script: Latn
  content: Modifications to the IEEE Std 802.15.4 medium access control (MAC) specification
    to specify mechanisms that address and improve user privacy are addressed in this
    standard. These mechanisms include randomized addresses and exchanges that support
    session continuity. This amendment maintains backward compatibility with the base
    standard.
