abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2015 adds Clause 116 through Clause 124
    and Annex 119A through Annex 120E. This amendment includes IEEE 802.3 Media Access
    Control (MAC) parameters, Physical Layer specifications, and management parameters
    for the transfer of IEEE 802.3 format frames at 200 Gb/s and 400 Gb/s.
