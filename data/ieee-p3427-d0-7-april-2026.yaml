abstract:
- language: en
  script: Latn
  content: 'This standard establishes a comprehensive framework for federated machine
    learning (FML) systems of semantic information agents (SIAs), addressing critical
    needs for efficiency, security, and human comprehension in SIAs environments.
    By systematically addressing agent formation through FML, including user roles
    for SIAs and reward mechanisms, the semantic knowledge base is built and data
    transmission efficiency of SIAs is enhanced. The proposed architecture comprises
    two primary layers: an information protocol layer that provides mechanisms to
    support secure and efficient data compression and transmission protocols for SIA
    interactions; and a semantic layer utilizing a Domain Specific Language (DSL)
    to maintain information readability among agents.'
