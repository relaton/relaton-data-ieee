abstract:
- language: en
  script: Latn
  content: The standard defines common exchange architecture and modeling technique
    to create interoperability of Internet of Food (IoF) devices, systems and applications.
    The data collection interface enables interoperable and trustworthy data collection
    from IoT devices for subsequent blockchain storage and processing. Data collection
    and exchange interface are also defined to facilitate development of agile, reliable
    and sustainable IoF solutions for various service and networking scenarios.
