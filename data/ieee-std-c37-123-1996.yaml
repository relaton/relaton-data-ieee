abstract:
- language: en
  script: Latn
  content: Technical requirements for the design, fabrication, testing, and installation
    of a gas-insulated substation (GIS) are provided. Parameters to be supplied by
    the purchaser and the technical requirements for the design, fabrication, testing,
    and installation to be furnished by the manufacturer are discussed. Environmental
    conditions, general and specific equipment requirements, and a proposal data sheet
    form are provided to aid the user.
