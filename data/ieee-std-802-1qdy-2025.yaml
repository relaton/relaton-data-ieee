abstract:
- language: en
  script: Latn
  content: 'This amendment to IEEE Std 802.1Q-2022 as amended by IEEE Std 802.1Qcz-2023,
    IEEE Std 802.1Qcw-2023, IEEE Std 802.1Qcj-2023, IEEE Std 802.1Qdj-2024, and IEEE
    Std 802.1Qdx-2024 addresses Multiple Spanning Tree Protocol (MSTP) requirements
    arising from industrial automation networks. It specifies YANG for Bridge and
    Bridge component RSTP as well as MSTP configuration and status reporting.(Note:
    The PDF of this standard is available at no charge compliments of the IEEE GET
    program https://ieeexplore.ieee.org/browse/standards/get-program/page/series?id=68)'
