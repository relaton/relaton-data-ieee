abstract:
- language: en
  script: Latn
  content: Described in this recommended practice are methods for improving the reliability
    of emergency and stand by power systems. Some of the factors examined include
    the specific application of the emergency or stand by equipment, environmental
    concerns, specification and acceptance testing of the equipment, and the operations
    and maintenance of the equipment.
