abstract:
- language: en
  script: Latn
  content: This standard specifies security requirements for trusted data spaces (TDS)
    that enable governed data sharing across organizational boundaries while preserving
    data sovereignty throughout the data lifecycle. It adopts a trust-but-verify approach
    by requiring continuous and verifiable trust establishment. The standard defines
    requirements for end-to-end confidentiality and integrity of data in transit,
    at rest, and in use, as well as transparent accountability through strong identification,
    non-repudiation, log attestation, and compliance enforcement. In addition, it
    specifies requirements for third-party auditability and security verification
    of privacy-preserving data processing technologies.
