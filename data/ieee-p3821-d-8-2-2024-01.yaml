abstract:
- language: en
  script: Latn
  content: A framework of the management system for digital intelligent comprehensive
    energy service stations is specified in this standard. Finance and business data
    of all types of energy resources in stations is managed by this system. Comprehensive
    energy services such as adding gasoline and natural gas, and car electric charging
    in one station are provided to consumers by the energy facilities described in
    this document.
