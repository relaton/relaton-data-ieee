abstract:
- language: en
  script: Latn
  content: This standard is proposed by IEEE for the standardized application of Internet
    of Things edge computing in UAV systems. It defines the terms of edge computing
    of UAV system (UAS), four core node types (onboard, drone-in-a-box, remote control,
    and remote cockpit), and constructs a three-tier system architecture consisting
    of application layer, cloud platform layer, and edge device layer. The document
    specifies in detail the functional requirements for communication, flight control,
    task planning, resource management, fault tolerance, time synchronization, intelligent
    analysis, especially for on board artificial intelligence applications, and proposes
    evaluation criteria for the system in terms of robustness, safety, efficiency,
    and flexibility. The appendix provides typical functional architecture diagrams
    of four edge computing forms, clearly showing the functional sets and open interfaces
    of each component; The "Function Component Deployment Method" mapping table is
    also provided, which details the core components, primary/secondary deployment
    locations, and technical specifications required for each core function (such
    as navigation, obstacle avoidance, task scheduling, etc.), providing specific
    and actionable technical guidance for system design and engineering implementation.
