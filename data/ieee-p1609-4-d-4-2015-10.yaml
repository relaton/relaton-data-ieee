abstract:
- language: en
  script: Latn
  content: Multi-channel wireless radio operations, Wireless Access in Vehicular Environments
    (WAVE) mode, medium access control (MAC), and physical layers (PHYs), including
    the operation of control channel (CCH) and service channel (SCH) interval timers,
    parameters for priority access, channel switching and routing, management services,
    and primitives designed for multi-channel operations are described in this standard.
