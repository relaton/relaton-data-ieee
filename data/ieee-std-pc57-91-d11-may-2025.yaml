abstract:
- language: en
  script: Latn
  content: The assumptions, techniques, and methods for estimating the effects of
    loading above nameplate of mineral-oil-immersed distribution and power transformers,
    as well as step voltage regulators, are described in this guide. Consequences
    due to loading above nameplate ratings are discussed, including damage to insulation,
    production of gases in oil, and ultimately loss of life. In addition, the effects
    of loading on auxiliary equipment are presented. Different types of loading scenarios,
    as well as variations in ambient temperature and altitude, are described. The
    effects of different cooling techniques and their impact on transformer capacity
    are reviewed. Transformer temperature criteria are also provided. Finally, calculation
    methods with and without consideration of duct oil effects are provided, along
    with sample temperature calculations.
