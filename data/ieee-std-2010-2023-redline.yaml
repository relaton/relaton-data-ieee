- language: en
  script: Latn
  content: Revising the set of documentation requirements and including new information
    and reflecting the present state of the art is covered in this recommended practice.
    A detailed set of documentation requirements is proposed. The detailed requirements
    for the documentation of neurofeedback instruments and software to provide quality
    and availability of information to users are specified by this recommended practice.
