abstract:
- language: en
  script: Latn
  content: 'This recommended practice follows a Safety by Design approach by providing
    recommendations for developing, deploying, and maintaining generative artificial
    intelligence models with adequate safeguards against child sexual abuse and exploitation.
    The document provides a framework that expands child safety measures related to
    sexual abuse and exploitation to the entire lifecycle of generative artificial
    intelligence: development, deployment, and maintenance stages. Each part in the
    process includes opportunities to prioritize child safety, regardless of modality
    (including, but not limited to text, image, video, audio) or whether an organization
    releases its technology as closed source or open source, or some release option
    between these two.'
