abstract:
- language: en
  script: Latn
  content: 'An application guide for non-ceramic line posts is being drafted. The
    guide will include handling recommendations, interpretation of manufacturer ratings,
    contamination considerations, and equivalency with porcelain. Project purpose:
    Users of non-ceramic line posts have questions regarding the use of the products
    which are not answered due to the lack of any official standard.'
