abstract:
- language: en
  script: Latn
  content: Class 1E motors, along with their interfaces, are required to meet or exceed
    the specified performance requirements throughout their service life. This is
    accomplished through a program that includes, but is not limited to, design, qualification,
    production quality control, shipping, storage, installation, operation, maintenance,
    periodic testing, and surveillance. The qualification portion of the program is
    addressed by this standard. The requirement for maintenance, repair, and surveillance
    of motors to maintain their qualification throughout their service life is discussed,
    but detailed guidance on how these programmatic items must be implemented and
    maintained is not provided. When the qualification requirements of this standard
    are met, the ability of the motor and/or insulation system to perform its safety
    function(s) under specified service conditions is demonstrated and documented.
