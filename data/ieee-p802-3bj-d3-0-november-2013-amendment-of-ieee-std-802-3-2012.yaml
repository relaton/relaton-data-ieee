abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2012 adds 100 Gb/s Physical Layer (PHY)
    specificationsand management parameters for operation on electrical backplanes
    and twinaxial coppercables. This amendment also specifies optional Energy Efficient
    Ethernet (EEE) for 40 Gb/s and100 Gb/s operation over electrical backplanes and
    copper cables.
