abstract:
- language: en
  script: Latn
  content: ISO/IEC/IEEE 15026-2:2022 specifies minimum requirements for the structure
    and its meaning of assurance cases. It does not place requirements on the quality
    of the contents but describes the structure and its meaning of assurance cases
    with the necessary level of precision and detail so as to avoid inconsistent and
    subjective use of the terms. While several notations and slightly varying terminologies
    are currently used in practice, this document does not require the use of any
    particular concrete representation including graphical representation. Likewise,
    it places no requirements on the means of physical implementation of the data;
    in particular, it includes no requirements for redundancy or co-location.
