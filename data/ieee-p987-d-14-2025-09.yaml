abstract:
- language: en
  script: Latn
  content: This guide is for the application of high-voltage suspension and line post
    composite insulators used to insulate and support overhead transmission and distribution
    lines. It deals with composite insulators that include a solid core rod, which
    in turn consists of a matrix of axially aligned glass fibers and a resin, an elastomeric
    material housing and weathersheds, and metal end-fittings. It is based on utility
    field experience, results of research laboratory tests, and manufacturers’ recommendations.
