abstract:
- language: en
  script: Latn
  content: A standard XML format for representing electronic design intellectual property
    (IP)quality information, based on an information model for IP quality measurement,
    is defined. Itincludes a schema and the terms that are relevant for measuring
    IP quality, including the softwarethat executes on the system. The schema and
    information model can be focused to representparticular categories of interest
    to IP users. In the context of this document, the term IP shall beused to mean
    electronic design intellectual property. Electronic design intellectual property
    is aterm used in the electronic design community to refer to a reusable collection
    of designspecifications that represent the behavior, properties, and/or representation
    of the design invarious media.
