abstract:
- language: en
  script: Latn
  content: This IEEE Standards product is part of the C57 family on Power Distribution
    and Regulating Transformers. This standard sets forth bar code label requirements
    for overhead, padmounted, and underground-type distribution transformers. Included
    herein are requirements for data content, symbology, label layout, print quality,
    and label life expectancy.
