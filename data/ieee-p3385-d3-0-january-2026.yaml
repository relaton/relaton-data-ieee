abstract:
- language: en
  script: Latn
  content: This guide specifies the principles and methodology for personal information
    protection on smart device. The requirements for usage and management of personal
    information are identified based on the life-cycle analysis of such personal information.
    Categories of personal information in different protection levels are taken into
    consideration, such as non-sensitive personal information (e.g., name) and sensitive
    personal information (e.g., account information, and financial payment information).
