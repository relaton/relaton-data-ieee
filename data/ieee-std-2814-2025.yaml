abstract:
- language: en
  script: Latn
  content: Techno-economic terminologies used in the construction and operation of
    low-carbon power generation and energy storage systems are defined. Techno-economic
    terminologies lack consistent definitions in today’s evolving low-carbon power
    generation and electrical energy storage. Stakeholders will be supported in using
    a common language when planning standards and for understanding published industrial
    and technical reports.
