abstract:
- language: en
  script: Latn
  content: Electrical circuit probes are essential components in the test and evaluation
    of electrical and electronic systems, subsystems, and circuits. Consequently,
    having a broadly accepted method for interconnecting the item under test to the
    test instrumentation is necessary for the intercomparison and reproducibility
    of test results. Moreover, the incorporation of standard test and measurement
    procedures ensures greater repeatability and confidence in test results. Methods
    for measuring parameters indicative of a probe’s or probe system’s performance
    and guidance on the design and use of a test fixture for measuring probe performance
    are provided by this standard. An industry-accepted, unbiased means for characterizing
    probe performance is given by these methods. High-impedance voltage probes that
    are used to measure the performance of electrical circuits are considered by this
    standard. The probe systems may include waveform acquisition hardware and software
    and signal/waveform analysis software. The probe will include the mechanism by
    which the circuit is contacted. This method and standard will be applicable to
    all individual probes having one signal conductor and one ground conductor or
    two signal conductors and having an input impedance at least five times greater
    than the impedance of the circuit under test.
