abstract:
- language: en
  script: Latn
  content: A standardized framework for the development of auxiliary decision-making
    systems in power grid operations is defined by this guide. The representation
    and construction of decision making models based on expert knowledge, operational
    rules, and other relevant sources are detailed. Functional requirements for knowledge-based
    decision support systems are also specified to help ensure consistent and effective
    implementation. The guide aims to support human operators in optimizing power
    grid operations by promoting the creation of intelligent, knowledge-driven decision-making
    systems. Improved efficiency, reliability, and consistency in power system operation
    and management are contributed to by this guide through standardization.
