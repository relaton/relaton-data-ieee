abstract:
- language: en
  script: Latn
  content: General recommendations are provided for users of motors that need repair
    as well as owners and operators of establishments that offer motor repair services.
    The use of this recommended practice is expected to result in higher quality,
    more cost-effective, and timely repairs. Guidelines are also provided for evaluating
    repairs and facilities.
