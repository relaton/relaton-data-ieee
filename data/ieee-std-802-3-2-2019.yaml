abstract:
- language: en
  script: Latn
  content: This standard defines YANG modules for various Ethernet devices specified
    in IEEE Std 802.3. This includes half-duplex and full-duplex data terminal equipment
    (DTE) using either Carrier Sense Multiple Access / Collision Detection (CSMA/CD)
    or Multipoint Control Protocol (MPCP), and Power Sourcing Equipment (PSE).
