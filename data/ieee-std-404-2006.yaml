abstract:
- language: en
  script: Latn
  content: This standard establishes electrical ratings and test requirements of cable
    joints used with extruded and laminated dielectric shielded cable rated in preferred
    voltage steps from 2500 to 500 000V. In addition, it defines test requirements
    for cable jacket and cable shield restoration devices. It also defines a variety
    of common joint constructions. This standard is designed to provide uniform testing
    procedures that can be used by manufacturers and users to evaluate the ability
    of underground power cable joints, and associated cable shield and cable jacket
    restoration components, to perform reliably in service.
