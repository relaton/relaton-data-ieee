abstract:
- language: en
  script: Latn
  content: The aspects of the reference architecture, components, interfaces, and
    functional requirements of the cloud subsystem of digital retina system (DRS)
    are specified in this standard to enable real-time aggregation and efficient retrieval
    of feature streams, as well as collaborative analysis of global data for city-level
    applications.
