abstract:
- language: en
  script: Latn
  content: 'This document provides requirements and guidance for the effective planning,
    design, and development of instructional video for information technology systems,
    products and services. Videos can present instructions for installation, operation,
    maintenance, and disposal for skilled or unskilled users. This document includes
    the use of video, interactive or hypervideo, animation, and virtual or augmented
    reality to explain how to use software and systems including hardware. This document
    covers both short video segments and the use of video in larger information products.
    Instructional videos can include concepts, instructional steps, and reference
    material. This document specifies content elements, structure, and use of media,
    including music, narration, captions, titles, and graphics. This document is applicable
    to instructional video developers, including a variety of specialists such as:
    information architects who plan the structure and format of information products,
    user experience specialists, customer experience specialists and business analysts
    who identify the tasks that the intended users can perform, reviewers/testers
    of instructional videos, graphic designers with expertise in electronic media,
    and experts working together to design the usage and presentation of the system
    or service. This document is also a reference for those with other roles and interests
    in the process of developing instructional videos.'
