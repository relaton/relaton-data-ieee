abstract:
- language: en
  script: Latn
  content: This standard pertains to direct-acting overcurrent, reverse-current, and
    undervoltage trip devices of both the electromechanical and ac solid-state types
    integral with low-voltage ac and general-purpose dc power circuit breakers covered
    by American National Standards. The solid-state direct-acting overcurrent trip
    devices may include ground trip elements. These direct-acting trip devices are
    sometimes referred to as "opening releases," especially in IEC (International
    Electrotechnical Commission) Recommendations or "Specifications."
