abstract:
- language: en
  script: Latn
  content: The cloud-edge collaborative intelligent computing architecture in the
    power industry is specified. Construction specifications and functional boundaries
    for power network cloud-level intelligent agent (PNCIA) and power network edge-level
    intelligent agent (PNEIA) are defined. Electrical-computing collaborative regulation
    principles, resource scheduling mechanisms, and dynamic task offloading specifications
    are established. User priority classification standards are defined. Information
    security requirements covering system security, identity and access control, communication
    security, and data privacy protection are established.
