abstract:
- language: en
  script: Latn
  content: Providing a set of market-based recommended practices for two-way interaction
    (vehicle-to-grid, V2G) technologies between electric vehicles (EVs) and the grid
    to facilitate the efficient integration and utilization of EVs as a flexible resource
    in the grid is the objective of this recommended practice. The overall architecture
    of the V2G system is described and a hierarchical zonal optimization operation
    model based on V2G technology to achieve the optimal allocation of charging and
    discharging power associated with electric vehicles is proposed. The application
    of market mechanisms in V2G technology and the importance of real-time measurement
    technology in V2G market settlement are emphasized, and a series of policy recommendations
    to guide the development of V2G technology are also proposed by this document.
    Through policy guidance and market incentives, the deep integration and effective
    interaction between EVs and the power grid and the cleaner transformation of energy
    as well as the construction of an efficient smart grid are promoted by this recommended
    practice.
