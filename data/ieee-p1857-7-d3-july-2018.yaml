abstract:
- language: en
  script: Latn
  content: This standard specifies the media presentation description format and media
    segment format for dynamic and adaptive streaming over networks such as HTTP.
    Particularly, the specified formats support multi-stream synchronization, content
    protection, and content authentication. The target applications and services include
    but not limited to Internet media streaming, IPTV, and video-on-demand.
