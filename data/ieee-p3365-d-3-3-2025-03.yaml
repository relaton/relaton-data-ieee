abstract:
- language: en
  script: Latn
  content: As the sales of electric vehicles (EV) continue to increase and their service
    life extends, lithium-ion batteries, the core components of EVs, face challenges
    in terms of performance degradation and safety. Therefore, regular inspection
    of the battery state is crucial. Traditional battery testing methods involve dismantling
    the battery pack, which is time-consuming, costly, and requires harsh testing
    conditions. Furthermore, since EV users are unable to obtain battery data and
    monitor its health status during daily use, this leads to concerns about vehicle
    safety and range anxiety. A performance index is specified that includes the information
    that EV users are concerned about, simplified testing procedures, and objective,
    third-party evaluation results. User evaluation of onboard battery performance
    and potential safety risks is assisted by this guide.
