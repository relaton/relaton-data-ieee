abstract:
- language: en
  script: Latn
  content: Superseded by 1048-2003. IEEE Guide for Protective Grounding of Power Lines,
    provides guidelines for safe protective grounding methods for persons engaged
    in de-energized overhead transmission and distribution line maintenance. This
    guide compiles state-of-the-art information on protective grounding practices
    employed by power utilities in North America
