abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2018 adds Physical Layer specifications
    and management parameters for 10 Gb/s, 25 Gb/s, and 50 Gb/s Ethernet optical interfaces
    for bidirectional operation over a single strand of single-mode fiber with reaches
    of at least 10 km, 20 km, and 40 km.
