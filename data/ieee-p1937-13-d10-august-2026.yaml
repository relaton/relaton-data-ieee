abstract:
- language: en
  script: Latn
  content: 'This standard defines the taxonomy of autonomy levels for Unmanned Aircraft
    Systems (UAS), including associated functional and technical requirements for
    each level and evaluation rules for autonomous capabilities. It is used to standardize
    UAS autonomy classification, guide UAS autonomous system development and application,
    and provide a basis for UAS autonomous capabilities evaluating. It includes definitions
    of three human-machine interaction paradigms (human in the loop, human on the
    loop, human off the loop), as well as requirements for seven categories of autonomous
    capabilities: the capability of flight control, environmental awareness, track
    and route planning, autonomous obstacle avoidance, energy resupply, responding
    faults and emergencies, and task decision-making.'
