abstract:
- language: en
  script: Latn
  content: This document establishes a common process framework for describing the
    full life cycle of software systems from conception through retirement. It applies
    to the acquisition or development of software products and services whether performed
    internally or externally to an organization. Those aspects of software system
    definition needed to provide the context for software products and services are
    included. The document also supports the definition, control, assessment, and
    improvement of these processes. These processes can be applied concurrently, iteratively,
    and recursively to a software system and its elements throughout the life cycle
    of a software system. Users of the document can apply the processes and terminology
    to construct a suitable life cycle model, composed of stages that use selected
    processes. The process purposes and outcomes in ISO/IEC/IEEE 15288:2023 (systems
    life cycle processes) and this document are fully aligned so that one may select
    appropriate activities from either document for use in systems with substantial
    software content.
