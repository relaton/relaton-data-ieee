abstract:
- language: en
  script: Latn
  content: This standard defines the representation method, model, and Application
    Programming Interface (API) for graph neural network (GNN), including graph data
    representation, GNN model specification, and methods for compressing and accelerating
    GNN models. It aims to establish unified interfaces and guidelines to enhance
    interoperability, efficiency, and ease of deployment for GNN applications across
    diverse platforms and computational environments.
