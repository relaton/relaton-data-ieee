abstract:
- language: en
  script: Latn
  content: The aspects of logical structure, collaborative framework, and functional
    requirements for the collaborative work of end, edge, and cloud subsystems in
    the digital retina system (DRS), as well as the processing model and interfaces
    concerning task collaboration, are specified in this standard. Implementable technical
    specifications for collaboratively processing and understanding the visual information
    across the end-edge-cloud platform by leveraging multiple data streams, including
    video, feature, and model, to enable real-time gathering of valuable information
    and collaborative data analysis are provided by this standard.
