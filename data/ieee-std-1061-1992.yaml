abstract:
- language: en
  script: Latn
  content: A methodology for establishing quality requirements and identifying, implementing,
    analyzing, and validating the process and product of software quality metrics
    is defined. The methodology spans the entire software life cycle. Although this
    standard includes examples of metrics, this standard does not prescribe specific
    metrics.
