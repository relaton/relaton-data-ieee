abstract:
- language: en
  script: Latn
  content: Superseded by 716-1995. Common ATLAS (C/ATLAS), a high-order language for
    testing is defined. C/ATLAS is designed to describe tests in terms that are independent
    of any specific test system. It has been constrained to ensure that it can be
    implemented on automatic test equipment.
