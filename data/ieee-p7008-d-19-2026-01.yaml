abstract:
- language: en
  script: Latn
  content: This standard provides organizations ethically driven design processes
    to design and deploy autonomous and intelligent systems that adaptively influence
    behavior by subtle means. These design, monitoring, and evaluation processes have
    been selected to help identify and address ethical dilemmas specific to autonomous
    and intelligent systems that influence behavior and decisions. The standard also
    requires the production of specific artifacts as evidence that organizations have
    taken adequate steps to help prevent and mitigate potential harm. The standard
    describes the concepts, functions, and benefits necessary to help establish ethically
    driven methodologies for the design of robotic, intelligent, and autonomous systems
    that incorporate them.
