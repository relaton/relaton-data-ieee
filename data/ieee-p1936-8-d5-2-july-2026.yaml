abstract:
- language: en
  script: Latn
  content: The monitoring of unmanned aircraft systems (UAS) has become an important
    tool for monitoring the operation status of photovoltaic (PV) power stations due
    to its high efficiency and accuracy. In order to standardize the hardware and
    software configuration, as well as operation technical requirements of the UAS
    monitoring to meet the requirements of UAS monitoring of PV power station, this
    standard specifies the technical requirements of the hardware components and communication
    architecture of the PV power station UAS monitoring system, the grid division
    of the patrol area, the selection of the UA hangar location, the coordination
    between the equipment, the UAS route planning and the monitoring task scheduling,
    etc., and puts forward the classification, identification and positioning requirements
    of defective PV devices based on optical and infrared image analysis. This standard
    can be used for UAS monitoring in the operation and maintenance stage of PV power
    stations.
