abstract:
- language: en
  script: Latn
  content: A parameterized and abstracted power model is described in this standard
    to enable system-, software-, and hardware IP-centric power analysis and optimization.
    Concepts are defined for the development of parameterized, accurate, efficient,
    and complete power models for systems and hardware IP blocks usable for system
    power analysis and optimization. These concepts include, but are not limited to,
    process, voltage, and temperature independence; power and thermal management interface;
    and workload and architecture parameterization.
