abstract:
- language: en
  script: Latn
  content: ISO/IEC/IEEE 15026-4 provides guidance and recommendations for assurance
    of a selected claim about the system-of-interest by achieving the claim and showing
    the achievement. Commonly, the selected claim is concerned with attributes such
    as dependability, safety, and security, where substantial risk can be involved.
    The guidance and recommendations are given as a System Assurance process view
    on top of ISO/IEC/IEEE 15288 Systems and software engineering -- System life cycle
    processes and as a Software Assurance process view on top of ISO/IEC/IEEE 12207
    Systems and software
