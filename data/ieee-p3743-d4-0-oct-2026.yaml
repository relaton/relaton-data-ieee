abstract:
- language: en
  script: Latn
  content: This recommended practice provides an open-source data schema that enables
    users to efficiently build and maintain electromagnetic transient (EMT) network
    models of electric power transmission systems. The EMT models require input from
    different existing sources of data for power flow, short circuit and positive
    sequence dynamics, supplemented with new data source definitions. In two recent
    white papers, North American grid regulatory authorities have identified EMT studies
    as essential to maintain grid reliability while accommodating the rapid increase
    of inverter-based resources (e.g. wind, solar, storage). Model-building for EMT
    is a time-consuming and error-prone part of the study. If software vendors implement
    this recommended practice, software users should be able to combine data from
    different sources, while reducing the time and cost of completing accurate EMT
    studies. This recommended practice applies to offline and real-time EMT simulation
    tools, and it supports data migration between software tools. It does not apply
    to EMT models of electric power distribution systems, nor to positive sequence
    dynamic models of either transmission or distribution systems.
