abstract:
- language: en
  script: Latn
  content: The intent of this Test Procedure is to establish a uniform method by which
    the life ofelectronics transformer insulation systems can be compared. Thermal
    degradation is generallyone of the major factors affecting the life of most insulating
    materials. It was chosen to be themajor environmental factor in this Test Procedure.
    Other environmental factors, such as vibration,thermal shock, and moisture, have
    been included to simulate operating conditions. Thesefactors have been chosen
    in such a way as to develop and disclose promptly any significantweaknesses during
    the temperature aging of an insulation system.
