abstract:
- language: en
  script: Latn
  content: This standard is concerned only with the reviews; it does not define procedures
    for determining the necessity of a review, nor does it specify the disposition
    of the results of the review. Review types include management reviews, technical
    reviews, inspections, walk-throughs, and audits.
