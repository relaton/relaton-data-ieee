abstract:
- language: en
  script: Latn
  content: 'Elements to improve transparency in the identification of the agency behind
    media or communications, such as machine intelligence, a human being, or a combination
    of entities, are defined in this standard. The goal is to facilitate transparency,
    understanding, and trust during online, telephone, robotic, or other electronic
    interactions, thereby strengthening provisions for public safety and security.
    Additional files can be found here: https://standards.ieee.org/wp-content/uploads/2025/05/3152-2024_downloads.zip'
