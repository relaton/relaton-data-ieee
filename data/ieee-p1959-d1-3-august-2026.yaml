abstract:
- language: en
  script: Latn
  content: This standard provides the descriptions and definitions of metrics to quantify
    energy efficiency of hardware architectures and systems used to implement machine
    learning (ML) models and algorithms for training and inference. It includes metrics
    for machine learning systems, from edge devices to data center servers, and their
    hardware components such as Central Processing Units (CPUs), Graphics Processing
    Units (GPUs), Field Programmable Gate Arrays (FPGAs), specialized processors,
    accelerators, memory, storage, communications interconnects, and network elements.
    The standard applies to ML hardware architectures and systems used in different
    application areas, such as image processing (or computer vision), Natural Language
    Processing (NLP), recommendation systems and scientific discovery. Machine learning
    models commonly used to implement above application types are considered, such
    as Large Language Models (LLMs) for NLP and Large Vision Models (LVMs) for computer
    vision. Creation of benchmarks is not in scope.
