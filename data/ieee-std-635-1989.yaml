abstract:
- language: en
  script: Latn
  content: Superseded by 635-2003. This standard outlines requirements and establishes
    design guidelines for the selection of aluminum sheaths for extra-high, high,
    medium-, and low-voltage cables. It establishes basic installation parameters
    for aluminum-sheathed cables. It also provides references to industry standards
    and codes incorporating design and installation requirements of aluminum-sheathed
    cables.
