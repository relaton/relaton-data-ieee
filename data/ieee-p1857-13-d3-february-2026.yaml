abstract:
- language: en
  script: Latn
  content: This standard specifies a representation for immersive audio content in
    Virtual Reality (VR) devices and related systems. It provides specifications for
    metadata, system architecture and interfaces for renderers. This standard is aimed
    at providing a high-quality and immersive audio experience in VR environments,
    thus enhancing the application and development of VR technology. By defining uniform
    expression methods and interface standards, compatibility between devices and
    systems can be enhanced, and it also facilitates the development of innovative
    VR audio applications.
