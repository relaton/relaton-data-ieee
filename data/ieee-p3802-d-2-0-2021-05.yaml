abstract:
- language: en
  script: Latn
  content: This standard provides reference and guideline for the blockchain-based
    e-commerce transaction evidence collecting (BETEC) platform, this standard describes
    the technical reference framework, basic functional requirements, and technical
    indicators of BETEC. This standard serves as a guide for blockchain service providers
    to integrate blockchain into traditional e-commerce transaction platform, to develop
    and design tamper-proof, full-process traceable BETEC platform.
