abstract:
- language: en
  script: Latn
  content: The guide describes dissection techniques and methodologies for form wound
    stator coils and bars from rotating machines. The techniques are for use at any
    point in the life cycle of a coil or bar, as dissection can be done as part of
    a manufacturing process, after qualification test, after machine faults, and on
    coils and bars with no faults. The guide applies to any given construction, including
    Vacuum Pressure Impregnation (VPI), Resin Rich (RR), and Global Vacuum Pressure
    Impregnation (GVPI) and other systems. Due to the variety of construction, materials,
    and manufacturing processes, the guide does not provide acceptance criteria for
    measurable parameters.
