abstract:
- language: en
  script: Latn
  content: An evaluation process and supporting test methods are provided in this
    standard to quantify the ability of a wireless device to coexist with other wireless
    services in its intended radiofrequency environments. This corrigendum corrects
    an error in Annex A of C63.27-2021 that appears to limit specifications of the
    unintended signal. Current recommendations require the user to generate a custom
    signal that can be overly burdensome. This corrigendum makes clear what the recommendations
    are, including the use of existing test signals standardized by others (e.g.,
    3GPP). It will also correct wording in Annex A that leads some readers to believe
    that other parts of the standard can be disregarded.
