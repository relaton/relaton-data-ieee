abstract:
- language: en
  script: Latn
  content: This draft standard specifies the technical requirements, data processing
    methods, and risk assessment criteria for the use of unmanned aircraft system
    (UAS) light detection and ranging (LiDAR) technology in identifying electrical
    system fault risks, such as low crossing clearance, foreign object contact, and
    fallen power lines due to tower displacement. It aims to improve data compatibility
    and maintenance efficiency by standardizing data collection, processing, and analysis
    procedures for power grid inspection applications.
