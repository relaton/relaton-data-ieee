abstract:
- language: en
  script: Latn
  content: Reference architecture, functional requirements, and interface requirements
    of the algorithm and model repository for digital retina system (DRS) are defined
    in this standard. Algorithm encapsulation and description requirements are specified.
    It can be applied to the design and development of the algorithm and model repository,
    as well as the unified encapsulation, management, and execution of algorithms
    and models.
