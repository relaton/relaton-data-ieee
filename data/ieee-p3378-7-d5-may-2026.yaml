abstract:
- language: en
  script: Latn
  content: This standard define reference architecture covering infrastructure, data
    resources, tools, model, agent, power application, and performance layers. It
    specifies technical requirements for data management, computing and network resources,
    domain capabilities including language, vision, scientific computing, time-series
    prediction and multimodality, as well as applications in power planning, grid
    operation, equipment maintenance, and market operation.
