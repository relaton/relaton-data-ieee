abstract:
- language: en
  script: Latn
  content: This standard provides a definition of organizational reliability capability
    and specifies the criteria for assessing the reliability capability of an organization.
    An organizational reliability capability assessment measures the effectiveness
    of a reliability program, the eight key reliability practices, and the activities
    used by an organization in meeting customer requirements. This standard can be
    used for either self-assessment or assessment of an external organization within
    the supply chain.
