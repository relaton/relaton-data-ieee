abstract:
- language: en
  script: Latn
  content: A blockchain service capability model, including four levels--basic, expansion,
    optimization and leading, which are indicated by I, II, III, and IV, respectively,
    from low to high--is established by this document. At the same time, the requirements
    that the service capability at all levels shall meet in terms of organization,
    personnel, technology, resources, and management processes are stipulated.
