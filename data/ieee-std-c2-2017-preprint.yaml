abstract:
- language: en
  script: Latn
  content: This publication has been prepared to provide all interested persons an
    opportunity to study and comment on the Proposed Revisions to be incorporated
    into the 2017 Edition of the National Electrical Safety Code (NESC&#174;). This
    Preprint provides the full text of each proposal to revise the 2012 Edition of
    the NESC together with the recommendation of the subcommittee that has cognizance
    of the rule addressed by the change proposal (CP). A change bar, located in the
    left hand margin, signifies the specific material that the various subcommittees
    each have approved for the inclusion in the revised Code.
