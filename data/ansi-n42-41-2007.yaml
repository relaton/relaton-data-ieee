abstract:
- language: en
  script: Latn
  content: "(Reaffirmed 2017) The performance criteria for active interrogation systems
    in Homeland Security applications are describe in this standard. These systems
    are intended for non-intrusive inspection of closed containers, vehicles, and
    packages of a wide range of types and sizes. In these systems, the contents of
    an inspection zone are irradiated with penetrating ionizing radiation to determine
    the presence of a hidden substance of interest by the analysis of stimulated secondary
    radiations or nuclear resonance absorption spectra that are indicative of the
    chemical and/or nuclide composition of the substance of interest."
