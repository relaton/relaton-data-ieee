abstract:
- language: en
  script: Latn
  content: Definitions and uniform procedures for review and audit applicable to both
    critical and noncritical software are provided. The processes include management
    review, technical review, software inspection, walkthrough, and audit. The processes
    defined are applicable throughout the software life cycle.
