abstract:
- language: en
  script: Latn
  content: This guide discusses various battery systems so that the user can make
    informed decisions on selection of batteries used in stationary applications.
    For each category, the technology and the design of the battery are described
    to facilitate user selection. The specific advantages for applications are also
    listed. The most common battery technologies used in stationary applications are
    divided into the following main categories:--Vented lead-acid (VLA)--Valve-regulated
    lead acid (VRLA)--Nickel-cadmium (Ni-Cd)--Lithium Ion (Li-Ion)
