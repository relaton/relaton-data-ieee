abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.1Q-2011 specifies shortest path bridging
    of unicast and multicast frames, including protocols to calculate multiple active
    topologies that can share learned station information, and support of a virtual
    local area network (VLAN) by multiple, per topology VLAN identifiers (VIDs). (Additional
    downloads for this standard are attached or can be downloaded at http://standards.ieee.org/downloads/802.1/index.html)
