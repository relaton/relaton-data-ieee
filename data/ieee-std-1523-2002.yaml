abstract:
- language: en
  script: Latn
  content: Various important aspects that are needed for satisfactory long-term performance
    of High-Voltage Insulator Coatings (HVIC) are presented in this guide. Various
    possible application scenarios, maintenance issues on coated insulators, factors
    affecting long-term performance, the question of aging, laboratory accelerated
    tests, and functional outdoor evaluation are described.
