abstract:
- language: en
  script: Latn
  content: The application of protective relays on transmission-line series capacitor
    banks is covered. The purpose of this guide is to provide the reader with ample
    discussion of the protection and control issues related to series capacitor bank
    installations. Specific examples related to protective functions and testing procedures
    are provided.
