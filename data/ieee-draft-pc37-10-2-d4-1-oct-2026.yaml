abstract:
- language: en
  script: Latn
  content: This document specifies the specifications for X-ray digital imaging inspection
    of high-voltage switchgear, including system composition, safety requirements,
    defect classification and focus areas, Radiographic testing procedure, image requirements,
    defect analysis. This document is applicable to on-site X-ray imaging inspection
    of high-voltage switchgear such as gas insulated switchgear (GIS) and circuit
    breakers. Other power equipment may refer to this document for implementation.
