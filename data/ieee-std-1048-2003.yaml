abstract:
- language: en
  script: Latn
  content: Guidelines for protective grounding methods for individuals engaged in
    de-energized overhead transmission and distribution line maintenance are provided.
    This guide also provides information on the sizing and maintenance of protective
    ground sets. It is a compilation of information on protective grounding practice
    employed by North American power utilities.
