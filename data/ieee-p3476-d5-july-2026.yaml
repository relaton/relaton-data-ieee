abstract:
- language: en
  script: Latn
  content: The transmission and distribution electric grid supply chain is expected
    to be improved through the implementation of a Digital Thread system in which
    asset attribute data is exchanged with supply chain partners in an industry standard
    digital format. This goal is achieved in the Supply Chain and Asset Traceability
    for the Electric Grid (SCATE) System defined in this standard through the use
    of industry- standard Unique IDs and Smart Tags (barcodes, QR Codes, RFID). The
    SCATE System defined in this standard specifies requirements for manufacturers
    to generate SCATE Unique IDs (UID) and apply Smart Tags to products. Users can
    scan Smart Tags and decode SCATE UIDs to ascertain important attribute data such
    as ratings, dimensions, and materials and to access additional data such as test
    reports and engineering drawings made available in an online asset record. Existing
    ISO standards for generating UIDs and encoding data into Smart Tags are leveraged
    in this standard, with additional functionality incorporated to meet the requirements
    of the electric grid industry. This standard provides a method, requirements,
    and controlled lists for the development of Data ModelsAsset Specifications to
    define SCATE UIDs for specific asset type.
