abstract:
- language: en
  script: Latn
  content: The pace of research and development 1 in neuroscience, neurotechnology,
    and neurorehabilitation is rapidly accelerating, with the number of publications
    doubling every 4.2 years. Maintaining this progress requires technological standards
    and scientific reporting guidelines to provide frameworks for communication and
    interoperability. The present lack of such neurotechnology standards limits the
    transparency, reproducibility, and meta-analysis of this growing body of literature,
    posing an ongoing barrier to research, clinical, and commercial objectives. Continued
    neurotechnological innovation requires the development of some minimal standards
    to promote integration between this broad spectrum of technologies and therapies.
    To preserve design freedom and accelerate the translation of research into safe
    and effective technologies with maximal user benefit, such standards must be collaboratively
    co-developed by the full range of neuroscience and neurotechnology stakeholders.
    This trial-use standard summarizes the recommendations of IEEE P2794 Standards
    Working Group.
