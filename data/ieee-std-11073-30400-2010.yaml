abstract:
- language: en
  script: Latn
  content: The application of the Ethernet family (IEEE Std 802.3-2008) of protocols
    for use in medical device communication is addressed in this document. The scope
    is limited to referencing the appropriate Ethernet family specifications and calling
    out any specific special needs or requirements of the ISO/IEEE 11073 environment,
    with a particular focus on easing interoperability and controlling costs.
