abstract:
- language: en
  script: Latn
  content: This standard contains practical methods for making laboratory electroacoustic
    measurements of analog and digital speech communications terminals and connected
    audio devices. The methods are applicable to a wide variety of wired, wireless,
    cordless, and mobile communication terminals for indoor or outdoor use. Examples
    include Voice over Internet Protocol (VoIP), wireless LAN (IEEE 802.11), and softphone
    devices. Tests applicable to connected audio devices such as wired, low-power
    wireless (IEEE 802.15), and universal serial bus (USB) handsets, headsets, and
    wearables are included. The standard contains objective metrics, subjective metrics,
    and subjective metric predictors. Application is in the frequency range from 20
    Hz to 20 kHz.
