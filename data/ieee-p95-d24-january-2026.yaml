abstract:
- language: en
  script: Latn
  content: This recommended practice provides uniform methods for testing insulation
    with high direct voltage, specifically form-wound windings of rotating ac electric
    machines typically rated 2300 V or higher. Recommendations for both (a) routine
    maintenance or repair testing of a machine that has been in service and (b) acceptance
    testing of new equipment in the factory or in the field after installation where
    DC testing is selected are defined.
