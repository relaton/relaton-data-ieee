abstract:
- language: en
  script: Latn
  content: This document implements ISO/IEC/IEEE 15288 for application on defence
    programs, providing the defence-specific language and terminology to help ensure
    the correct application of acquirer-supplier requirements for a defence program.
    It provides the basis for selection, negotiation, agreement, and performance of
    necessary systems engineering activities and delivery of products, while allowing
    flexibility for both innovative implementation and tailoring of the specific systems
    engineering process(es) to be used by system suppliers, either contractors or
    government system developers, integrators, maintainers, or sustainers. This document
    includes the expected or required outputs and associated attributes.
