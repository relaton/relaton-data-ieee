abstract:
- language: en
  script: Latn
  content: Definitions, terminologies, and architectural framework of the Internet
    of Clothing (IoC) system are developed in this standard. Data scheme, information
    modeling, and key technological requirements are also defined to help ensure interoperable
    and agile IoC network solutions and service delivery for apparel industry and
    end-use applications.
