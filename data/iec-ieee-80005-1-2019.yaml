abstract:
- language: en
  script: Latn
  content: For a variety of reasons, including environmental considerations, it is
    becoming an increasingly common requirement for ships to shut down ship generators
    and to connect to shore power for as long as practicable during stays in port.
    The scenario of receiving electrical power and other utilities from shore is historically
    known as "cold ironing". The intention of this part of IEC/IEEE 80005 is to define
    requirements that support, with the application of suitable operating practices,
    efficiency and safety of connections by compliant ships to compliant high-voltage
    shore power supplies through a compatible shore-to-ship connection. With the support
    of sufficient planning, cooperation between ship and terminal facilities, and
    appropriate operating procedures and assessment, compliance with the requirements
    of this document is intended to allow different ships to connect to high-voltage
    shore connections (HVSC) at different berths. This provides the benefits of standard,
    straightforward connection without the need for adaptation and adjustment at different
    locations that can satisfy the requirement to connect for as long as practicable
    during stays in port. Ships that do not apply this document can find it impossible
    to connect to compliant shore supplies. Where deviations from this document are
    considered, it is useful to note the effects of such deviations in the compatibility
    study. Where the requirements and recommendations of this document are complied
    with, highvoltage shore supplies arrangements are likely to be compatible for
    visiting ships for connection.
