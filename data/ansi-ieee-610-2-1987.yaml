abstract:
- language: en
  script: Latn
  content: This glossary defines terms in the field of computer applications. Topics
    covered include automated language processing, automatic indexing, business data
    processing, character recognition, computer-aided design and manufacturing, computer-assisted
    instruction, control systems, critical path method, library automation, medical
    applications, micrographics, office automation, operations research, personal
    computing, scientific and engineering applications, telecommunication applications,
    and word processing.
