abstract:
- language: en
  script: Latn
  content: Superseded by C62.59-2019. Avalanche breakdown diodes used for surge protection
    in systems with voltages equal to or less than 1000 V rms or 1200 V dc are discussed
    in this standard. The avalanche breakdown diode surge suppressor is a semiconductor
    diode which can operate in either the forward or reverse direction of its V-I
    characteristic. This component is a single package, which may be assembled from
    any combination of series and/or parallel diode chips.
