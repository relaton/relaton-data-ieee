abstract:
- language: en
  script: Latn
  content: The virtual power plant (VPP) discussed in this guide is an 1 electric
    power plant capable of supplying electrical power to the electric power grid and
    to local loads. This document provides guidance for the development of a functional
    specification for a VPP control system. The functional specification covers local
    energy management and grid interaction functions. The VPP incorporates local controllable
    and dispatchable power generation, such as combined heat and power (CHP) units
    and microreactors (based on small modular reactors, SMR, technology). It may integrate
    local renewable energy resources (solar PV and wind generation), and electric
    energy storage (battery energy storage) and thermal storage systems. The guide
    discusses the implementation of the VPP control systems, addresses their basic
    functional requirements, and proposes a set of core functions for the control
    systems. These functions include generation production estimation and scheduling
    from all sources; local load estimation and management; the provision of grid
    services (energy, capacity) and ancillary services (voltage and frequency control/support)
    to the electric power system (EPS). Generic requirements for grid interconnection
    and integration, and for interoperability with other EPS systems are addressed.
    Islanded operation of a VPP feeding local loads and operating as a microgrid for
    enhancing energy supply security and resilience is discussed.
