abstract:
- language: en
  script: Latn
  content: As governments increasingly adopt digital health services and digital access
    becomes ubiquitous through internet and mobile technologies, differing approaches
    to personal health record (PHR) systems have become more apparent. Across countries
    and economic regions, successful implementation and widespread adoption have led
    to the emergence of de facto models that reflect local healthcare, regulatory,
    and societal requirements. Despite this progress, significant differences remain
    in system functionality, interoperability, architecture, and implementation. While
    foundational standards such as Health Level Seven (HL7) and Fast Healthcare Interoperability
    Resources (FHIR) provide a common technical framework, the design of user interactions,
    information governance, and functional capabilities remains largely proprietary.
    To advance global interoperability and standardization, a clearer distinction
    is needed between PHRs and patient-controlled electronic health records (EHRs).
    These systems differ in their ownership, control, and data-management characteristics,
    creating unique challenges for harmonization and interoperability. This white
    paper examines those challenges across three key areas and identifies opportunities
    for greater international alignment
