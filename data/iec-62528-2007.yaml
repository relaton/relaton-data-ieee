abstract:
- language: en
  script: Latn
  content: Replaced IEEE Std 1500-2005. This standard defines a mechanism for the
    test of core designs within a system on chip(SoC). This mechanism constitutes
    a hardware architecture and leverages the core test language(CTL) to facilitate
    communication between core designers and core integrators.
