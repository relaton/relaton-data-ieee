- language: en
  script: Latn
  content: 'This document is a standard set of recommended practices for ecosystem-scale
    technical providers related to issuing, holding, and presenting learning and employment
    records (LERs) for education and employment achievements and related data. Extensive
    normative and declarative references to other existing standards, open-source
    projects, and shared services are made by it. Additional Open Source content available
    here: https://opensource.ieee.org/ler'
