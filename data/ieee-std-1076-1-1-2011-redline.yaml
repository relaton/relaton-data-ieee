abstract:
- language: en
  script: Latn
  content: Superseded by 1076.1-2017. This standard defines a collection of VHDL 1076.1
    packages, compatible with IEEE Std 1076.1, along with recommendations for conforming
    use, in order to facilitate the interchange of simulation models of physical components
    and subsystems. The packages include the definition of standard types, subtypes,
    natures, and constants for modeling in multiple energy domains (electrical, fluidic,
    mechanical, etc.).
