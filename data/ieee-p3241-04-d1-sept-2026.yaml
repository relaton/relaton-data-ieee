abstract:
- language: en
  script: Latn
  content: This standard defines an architecture for blockchain-based accounting of
    the carbon emission factors of electric power generation systems, after subtracting
    environmental attributes. The standard also describes how data is recorded on
    the blockchain, how emission factors are calculated, and what security and privacy
    requirements apply to the net emission factor data.
