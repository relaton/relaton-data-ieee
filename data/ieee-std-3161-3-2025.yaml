abstract:
- language: en
  script: Latn
  content: The aspects of the reference architecture, components, interfaces, and
    functional requirements of the edge subsystem of the digital retina system (DRS)
    are specified in this standard. These specifications supported effective processing
    of the video, feature, and model streams, as well as collaborative analysis of
    regional data.
