abstract:
- language: en
  script: Latn
  content: Requirements for initiating, planning, controlling, and executing the software
    quality assurance (SQA) processes of a software development or maintenance project
    are established in this standard. This standard is harmonized with the software
    life cycle processes of ISO/IEC/IEEE 12207:2017, IEEE Std 2675™-2021, and the
    information content requirements of ISO/IEC/IEEE 15289:2019.
