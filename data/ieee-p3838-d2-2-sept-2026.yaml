abstract:
- language: en
  script: Latn
  content: This standard specifies the architecture, identification protocols, data
    structures, security controls, and operational procedures for a Personal UAV Identification
    and Management System (PUIMS) operating in low-altitude airspace at altitudes
    below 1000 m above the local elevation. It specifies requirements for identity
    assignment, product identification, owner and operator associations, remote identification
    records, lifecycle status, controlled access, audit records, and conformance evidence.
