abstract:
- language: en
  script: Latn
  content: This part of ISO/IEC/IEEE 24748 defines the processes for technical reviews
    and audits to be performed on defence projects. This document also defines the
    review and audit topics associated with technical reviews and audits. It can be
    used to establish agreement between acquirers and suppliers on the technical reviews
    and audits that are needed for a project, as well as the focus and expectations
    of each technical review and audit.
