abstract:
- language: en
  script: Latn
  content: An energy-efficient, rate and modulation adaptive transmission system designed
    for the deployment of mixed line rates in optical networks is specified by this
    standard. The transmission system is introduced by this standard, and mechanisms
    to optimally configure the line rate to efficiently accommodate varying traffic
    loads while reducing the power consumption are provided.
