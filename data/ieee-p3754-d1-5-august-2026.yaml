abstract:
- language: en
  script: Latn
  content: This document provides technical specifications and test methods for prefabricated
    assembly modules of distribution substations, applicable to voltage levels ranging
    from 0.4kV to 22kV. It covers transformer frames, branch circuits, and fittings.
    The technical requirements and test methods outlined herein serve as recommended
    guidelines for the design, manufacturing, factory prefabrication, and inspection
    of such modules.
