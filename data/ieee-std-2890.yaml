abstract:
- language: en
  script: Latn
  content: A common set of parameters for the provenance of Indigenous Peoples’ data
    is established in this recommended practice. This recommended practice supports
    the appropriate disclosure of Indigenous Peoples’ relationships and/or links to
    all data. The provenance of Indigenous Peoples’ data includes information that
    facilitates Indigenous Peoples’ governance, decision-making, participation, collaboration,
    and engagement in, and for, current and future uses of Indigenous Peoples’ data.
