abstract:
- language: en
  script: Latn
  content: This standard specifies protocols for transmission of equipment status
    and control data of remote sensing networks that use Unmanned Aerial Systems (UASs).
    It defines the standardized data formats and exchanging mechanism for equipment
    status data and control data exchanged among UAVs, docking stations and the management
    and control platform, establishing the structural framework and encoding rules
    for these data types to enable automated operations including docking, charging,
    flight control, and mission management. The document aims to facilitate reliable
    interoperability and seamless integration of UAV systems through unified data
    interface specifications.
