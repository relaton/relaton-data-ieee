abstract:
- language: en
  script: Latn
  content: A framework for a data security circulation system that is based on blockchain
    and federated computation is provided in this standard. Technical requirements
    for the data source layer, the collaboration layer, the interface layer, the application
    layer, as well as operations monitoring are specified. This standard is applicable
    to the specification, design, development, implementation, and testing of a blockchain
    that is combined with a federated computation framework and provides a reference
    framework for relevant organizations and institutions.
