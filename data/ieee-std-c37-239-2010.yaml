abstract:
- language: en
  script: Latn
  content: A common format for data files used for the interchange of various types
    of event data collected from electrical power systems or power system models is
    defined. Extensibility, extension mechanisms, and compatibility of future versions
    of the format are discussed. An XML schema is defined. A sample file is given.
