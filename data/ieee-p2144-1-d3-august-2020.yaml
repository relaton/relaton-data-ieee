abstract:
- language: en
  script: Latn
  content: A framework of blockchain-based Internet of Things (IoT ) data management
    is defined in this standard. It identifies the common building blocks of the framework
    that blockchain enabled during IoT data lifecycle including data acquisition,
    processing, storage, analyzing, usage/exchange and obsoletion, and the interactions
    among these building blocks.
