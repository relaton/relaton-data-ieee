abstract:
- language: en
  script: Latn
  content: Profiles of IEEE 802.1 Time-Sensitive Networking (TSN) for aerospace onboard
    bridged IEEE 802.3 Ethernet networks are specified in this standard. The profiles
    select features, options, configurations, defaults, protocols, and procedures
    of bridges, end stations, and Local Area Networks to build deterministic networks
    for aerospace onboard communications.
