abstract:
- language: en
  script: Latn
  content: Symbols to inform people about the presence of potentially hazardous levels
    of radio-frequency energy or the presence of contact current hazards in the frequency
    range of 3 kHz to300 GHz are specified. Guidance is given about how these symbols
    should be used on warning signs and labels.
