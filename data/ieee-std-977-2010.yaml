abstract:
- language: en
  script: Latn
  content: Various approaches to good construction practices that could improve the
    installation of transmission line structure foundations are presented. Spread
    foundations, drilled shaft foundations, pile foundations, and anchors are treated.
    This guide is intended to be used as a reference source for those involved in
    the ownership, design, and construction of transmission structures.
