abstract:
- language: en
  script: Latn
  content: In the field of power inspection, multi-rotor unmanned aircraft systems
    (UAS) are widely used. Long-term high-voltage electromagnetic field environments
    and complex climatic conditions are faced by highly integrated and precise power
    inspection drones. If not properly maintained, devices in the multi-rotor UAS
    may malfunction during the operation. The long-term safe and stable operation
    of power inspection drones can be aided by proper maintenance of the multi-rotor
    UAS. At present, there is no unified specification for maintenance personnel and
    no technical requirements for troubleshooting and fault diagnosis of multi-rotor
    UAS software and hardware. In this context, the formulation of this standard helps
    to standardize the maintenance procedures of multi-rotor UAS to support the reliability
    and safety of multi-rotor UAS operation.
