abstract:
- language: en
  script: Latn
  content: A flexible optical service unit (OSU) path layer is specified by this standard
    for optical networks, providing services ranging from 2 Mb/s to 100 Gb/s. The
    main features of the OSU path layer are being offered in the form of massive OSU
    connections that carry packet and constant bit rate (CBR) services with guaranteed
    performance, enabling the flexible hitless bandwidth adjustment (e.g., n × 10
    Mb/s) for each OSU connection, along with capabilities such as high-bandwidth
    efficiency, large capacity, and low latency. The OSU path layer can be carried
    on different server layers, for instance, optical transport network (OTN), passive
    optical network (PON), among others. High-quality leased line services and video
    services, with guaranteed performance, that are utilized in telecom operators’
    optical networks and other industry transport networks are supported by this standard.
