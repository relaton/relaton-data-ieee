abstract:
- language: en
  script: Latn
  content: This standard is part of the POSIX series of standards for applications
    and user inter-faces to open systems. It defines the applications interface to
    system services for spawning a process, timeouts for blocking services, sporadic
    server scheduling, execution time clocks andtimers, and advisory information for
    file management. This standard is stated in terms of its Cbinding.
