abstract:
- language: en
  script: Latn
  content: To help ensure the continued relevance of the National Electrical Safety
    Code® (NESC®) within the communications and power industry and the workers it
    serves, NESC leadership decided in 2014 to review the organization's future, its
    processes, and ongoing issues such as whether it should emphasize design criteria
    and construction versus the standing 100 years of safety. A review of this nature
    was deemed particularly important given the rapid evolution of new technologies
    and other changes affecting NESC's domain. The 2015 NESC Summit held 28-29 April
    2015, in Alexandria, Virginia, offered an opportunity to discuss these issues
    and debate the future of the NESC.
