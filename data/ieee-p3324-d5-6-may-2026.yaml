abstract:
- language: en
  script: Latn
  content: General requirements for the design, installation, and maintenance of blue-green
    laser communication system - covering composition, configurations, working conditions,
    typical performances, test methods, and inspection rules-are specified by this
    guide. Requirements for blue-green laser communication systems, which are used
    for industrial underwater operations, are specified by this guide. Procedures
    of how requirements for the systems are to be standardized are also specified.
    Specific requirements and guidance in the testing and inspection of blue-green
    laser communication systems that are covered within its scope are provided by
    this guide. Blue-green laser communication system hardware components, system
    and networking performance characteristics, design parameters, and implementation
    considerations are also described.
