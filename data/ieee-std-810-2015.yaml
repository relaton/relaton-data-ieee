abstract:
- language: en
  script: Latn
  content: The dimensions for all types of shaft couplings and shaft runout tolerances
    for hydraulic turbines and generators are included in this standard. Shafts and
    couplings included in this standard are used for both horizontal and vertical
    connections between generators and turbines in hydroelectric installations.
