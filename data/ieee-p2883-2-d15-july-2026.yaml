abstract:
- language: en
  script: Latn
  content: his document provides recommendations for implementers of virtualized and
    cloud storage systems that support file and block storage interfaces to facilitate
    storage sanitization. Use cases for multi-tenancy, self-encrypting devices, and
    host encrypted storage are defined and recommendations for risk mitigation are
    provided.
