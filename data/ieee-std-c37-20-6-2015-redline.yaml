abstract:
- language: en
  script: Latn
  content: Drawout-type ground and test devices for use in medium-voltage metal-clad
    switchgear rated 4.76 kV through 38 kV are covered. The description, design, and
    testing of these accessory devices that are inserted in place of drawout circuit
    breakers for the purpose of grounding and testing are also covered.
