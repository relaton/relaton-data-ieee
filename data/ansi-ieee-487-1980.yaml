abstract:
- language: en
  script: Latn
  content: 'Superseded by 487-1992. Workable methods for protecting wire-line communication
    circuits entering power stations are presented. This document covers: the electric
    power station environment; protection apparatus; services types, reliability,
    service performance objective classifications, and transmission considerations;
    protection theory and philosophy; protection configurations; installation and
    inspection; and safety.'
