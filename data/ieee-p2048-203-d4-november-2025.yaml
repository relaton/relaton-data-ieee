abstract:
- language: en
  script: Latn
  content: This standard specifies interconnection security requirements for a blockchain-based
    metaverse. These requirements relate to the user identity, network operation,
    asset trading and data circulation. In improving the interoperability of metaverse
    platforms the standard helps to securely circulate virtual assets between different
    metaverse platforms.
