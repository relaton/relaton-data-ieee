abstract:
- language: en
  script: Latn
  content: The scope of this standard is upper layer [i.e., the International Organization
    for Standardization (ISO's) open systems interconnection (OSI) application, presentation
    layer, and session layer] services and protocols for information exchange under
    the ISO/IEEE 11073 standards for medical device communications (MDC). This standard
    is the base standard of the ISO/IEEE 11073-20000 medical device application profiles
    (MDAP), as harmonized through the Committee for European Normalization (CEN) and
    the ISO.
