  script: Latn
  content: This amendment to IEEE 802.1Q,1998 Edition is intended to document maintenance
    items identified in the text of IEEE Std 802.1Q,1998 Edition.IEEE Std 802.1u-2001
    identifies any proposed changes to IEEE Std 802.1Q,1998 Edition that have arisen
    as a consequence of maintenance activity.The changes are documented in the usual
    form for an amendment to IEEE 802 standards;i.e.,as an explicit set of editing
    instructions that,if correctly applied to the text of IEEE Std 802.1Q,1998 Edition,will
    create a corrected document.
