abstract:
- language: en
  script: Latn
  content: This standard provides training requirements as part of the capabilities
    of public safety agencies to detect, analyze, and report on nuclear and other
    radioactive materials that are out of regulatory control. This standard describes
    training requirements applying across a wide range of agencies, governments, and
    the private sectors conducting the preventive radiological/nuclear detection (PRND)
    mission to reduce the risk of terrorist or covert state-sponsored attacks using
    radiological or nuclear weapons of mass destruction (WMDs). The scope of this
    standard includes the capabilities for prevention and protection mission areas,
    but not those for mitigation, response, and recovery mission areas. The scope
    includes core capability for screening, search, and detection. This standard specifies
    how PRND instruments are used in the mission areas. This standard does not include
    the capabilities specific to nuclear safeguards, security of nuclear facilities,
    or nuclear forensics. Consideration of radiation detection instrumentation used
    for the PRND mission areas is part of the training requirements. Radiation detection
    instruments used primarily for other missions and capabilities (e.g., response
    and recovery mission areas) may have some applications for PRND mission areas
    and capabilities.
