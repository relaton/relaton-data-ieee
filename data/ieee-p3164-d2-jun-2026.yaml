abstract:
- language: en
  script: Latn
  content: The standard is collateral-centric with a focus on security concerns; it
    applies to electrical designs that are integrated into other circuits. The standard
    defines a methodology that (1) identifies elements, such as input or output ports,
    that can influence the behavior of a critical section within the design and (2)
    associates known security weaknesses based on the type of design and/or critical
    section. The methodology uses data objects, which are both human and machine readable,
    to capture security relevant information through the architectural and design
    phase of the electrical design to be consumed by an integrator for their product
    lifecycle. The standard is independent of existing standards and is not part of
    the electrical design itself.
