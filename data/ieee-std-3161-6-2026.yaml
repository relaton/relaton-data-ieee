abstract:
- language: en
  script: Latn
  content: System frameworks, functional requirements for data management and storage,
    and interface requirements of the storage system of a digital retina system (DRS)
    are defined in this standard. Specifications for the design and development of
    related systems are provided. The collaborative interaction among storage services
    within the storage system of DRS is also supported.
