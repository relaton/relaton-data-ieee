abstract:
- language: en
  script: Latn
  content: The definition of metadata fields for describing complex images formed
    via synthetic aperture radar (SAR) is provided. The metadata content structure,
    as well as the text representation, are specified. The means for describing the
    instrument, the acquisition, operating mode(s), and parameters, as well as the
    processing algorithms that have been applied to the data and any parameters related
    to those processing algorithms, are provided.
