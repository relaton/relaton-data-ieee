abstract:
- language: en
  script: Latn
  content: Approaches to good Software Quality Assurance practices in support of IEEE
    Std 730-1989, IEEE Standard for Software Quality Assurance Plans, are identified.
    These practices are directed toward the development and maintenance of critical
    software, that is, where failure could impair safety or cause large financial
    losses.
