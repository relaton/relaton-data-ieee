abstract:
- language: en
  script: Latn
  content: This amendment to the standard addresses enhancements to the existing standard
    to improve its applicability and usability for end-users, particularly for smaller
    organizations, and to provide specific guidance for managing Radio Frequency Interference
    (RFI) aggressors for Protected Wireless Networks (PWNs) operating under 7 GHz.
    The proposed changes include the addition of main body text, reference data items,
    and an annex to specify RFI interference specifications and requirements for PWNs
    operating under 7 GHz.
