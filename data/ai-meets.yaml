abstract:
- language: en
  script: Latn
  content: 'Artificial intelligence (AI) is rapidly changing the automotive industry.
    Advanced driver-assistance systems (ADAS) features, such as hands-free driving,
    intelligent braking, and real-time traffic sign recognition, driven by machine
    learning, are no longer science fiction. However, despite the excitement surrounding
    AI, a significant challenge has emerged: how can the automotive industry ensure
    that AI-driven functionality is implemented safely? This paper explores how traditional
    engineering processes, especially the V-model used in automotive development,
    can evolve to include AI safely and effectively. AI is not just a nice-to-have
    feature; it is becoming essential. The only way to build trust in autonomous and
    connected vehicles is to make AI safety a top priority from the very beginning
    of the development process.'
