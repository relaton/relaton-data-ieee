abstract:
- language: en
  script: Latn
  content: High-strain testing instruments for deep foundations are testing devices
    used to evaluate the load-bearing capacity and integrity of foundation piles.
    Unlike low-strain testing, they apply a large impact force to the pile head to
    generate stress waves, simulating actual pile loading conditions. This standard
    specifies the terms, symbols, basic requirements, and technical specifications
    for high-strain testing instruments. It also includes necessary requirements such
    as hardware requirements; software requirements; shock amplitude linearity error,
    impact zero drift, center frequency and bandwidth of the acceleration measurement
    system; its static performance and dynamic performance; dynamic range; channel
    conformity error; environmental robustness; and electromagnetic compatibility.
    This standard also provides testing methods, inspection rules, and marking requirements
    for high-strain testing instruments.
