abstract:
- language: en
  script: Latn
  content: This guide provides a framework for pricing mechanisms in the market of
    data elements used within digital finance. It defines the technical requirements,
    mechanisms for pricing evaluation, formation, and operation, as well as the roles
    and functions of the key stakeholders involved in the data exchange process. By
    leveraging federated computing technology, the guide helps ensure the protection
    of data privacy and compliance with regulatory requirements. The scope covers
    the development of a secure and efficient pricing system for data elements, aiming
    to foster multi-party cooperation despite increasing data silos. Additionally,
    the framework highlights the importance of data privacy in cross-border data circulation
    and transactions.
