abstract:
- language: en
  script: Latn
  content: Based on the end-edge-cloud collaboration characteristics of the digital
    retina system (DRS), the DRS faces multidimensional security and privacy risks.
    This standard specifies the aspects of a framework for security and privacy protection,
    the security and privacy protection baseline requirements applicable to subsystems,
    the principles for security and privacy classification and grading levels, and
    the security and privacy requirements of DRS.
