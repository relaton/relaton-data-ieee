abstract:
- language: en
  script: Latn
  content: General requirements, on-site acceptance methods, marks, packaging, transportation,
    storage, and application guidance of the double horizontal jibs gin pole on the
    ground are described in this guide. This guide applies to double horizontal jibs
    gin pole on ground with rated lifting torque not exceeding 15 000 kN·m, overall
    gin pole's height not exceeding 460 m, and lifting height not exceeding 430 m.
    This type of gin pole is fully applicable to transmission towers with an overall
    height up to 385 m.
