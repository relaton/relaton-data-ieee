abstract:
- language: en
  script: Latn
  content: General requirements of visual inspection of surface mount devices (SMD)
    for surface mount technology (SMT) machines, including the format of chip parameters
    data exchange, the function and technical requirements of each module of the visual
    inspection algorithm, and the storage structure of chip parameters are specified
    in this standard. Unified data format and interfaces of the algorithms between
    different SMT machines are also specified in this standard.
