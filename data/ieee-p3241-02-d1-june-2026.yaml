abstract:
- language: en
  script: Latn
  content: This standard specifies the data format for blockchain-based carbon trading,
    covering information about trading entities (sellers or buyers), traded products,
    transaction behaviors, transaction data signatures, and other extended fields
    related to carbon trading. It applies to various blockchain-based carbon trading
    systems, including but not limited to national or regional carbon emission trading
    systems, voluntary emission reduction project trading platforms, as well as internal
    corporate or industry alliance carbon trading applications.
