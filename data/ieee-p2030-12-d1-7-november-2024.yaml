abstract:
- language: en
  script: Latn
  content: A microgrid control system and a microgrid protection system are required
    for microgrid deployment. The nature of the microgrid assets, which may include
    a significant amount of distributed energy resources, and the modes of operation,
    either grid-connected or islanded, need to be considered in the design of both
    systems. The design and selection of protective devices and their coordination
    for the microgrid’s different modes of operation are covered by this guide. Different
    approaches to detect and take proper actions and to dependably and securely protect
    the microgrid and its equipment are proposed.
