abstract:
- language: en
  script: Latn
  content: Requirements are provided for 60-Hz open-ventilated air-cooled cylindrical-rotor
    synchronous generators rated 10,000 kVA and above. Classification, service conditions,
    output rating and capabilities, temperature, abnormal and short-circuit requirements,
    efficiency, overspeed, telephone influence factor, tests, direction of rotation,
    and nameplate marking are covered. A performance specification form is shown.
