abstract:
- language: en
  script: Latn
  content: An exchange format using extensible markup language (XML) for identifying
    all of the hardware, software, and documentation associated with a test adapter
    is specified in this document. This test adapter may be used as a component of
    a test program set to test and diagnose a unit under test.
