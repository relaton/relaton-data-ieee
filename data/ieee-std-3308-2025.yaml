abstract:
- language: en
  script: Latn
  content: This standard adopts MPAI Technical Specification V1.0 as an IEEE Standard.
    The Moving Picture, Audio and Data Coding by Artificial Intelligence (MPAI) Technical
    Specification Object and Scene Description (MPAI-OSD) V1.0 specifies data formats
    to enable description and localization of uni- and multi-model object and scenes
    in a virtual space for uniform use across MPAI Technical Specifications.
