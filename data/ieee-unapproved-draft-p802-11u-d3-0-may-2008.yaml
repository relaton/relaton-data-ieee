abstract:
- language: en
  script: Latn
  content: This amendment specifies enhancements to the 802.11 MAC that support WLAN
    Interworking with External Networks. It enables higher layer functionalities to
    provide overall end-to-end solution. Main goals of 802.11u are enabling information
    transfer from external networks, aiding network selection, and enabling emergency
    services.
