abstract:
- language: en
  script: Latn
  content: A method for transporting IEEE 1451™ messages over a network using Message
    Queue Telemetry Transport (MQTT) to establish a light-weight, simplified protocol
    structure to handle IEEE 1451 communications is defined by this standard. Also,
    the establishment of a light-weight, simplified protocol structure to handle IEEE
    1451 communications over MQTT is enabled by this standard. Adding to the MQTT
    standards’ recommended methods, three different formats of IEEE 1451.0™ message
    carriers are defined. Moreover, time-synchronization, security, and other useful
    extensions are also defined by this standard.
