abstract:
- language: en
  script: Latn
  content: Procedures and various considerations involved when planning and designing
    electrical power distribution systems serving industrial plants and commercial
    facilities are outlined. Typical load data and a suggested method for determining
    individual and total connected and total demand load characteristics of industrial
    plants and commercial buildings are included.
