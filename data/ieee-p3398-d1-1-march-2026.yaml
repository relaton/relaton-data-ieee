abstract:
- language: en
  script: Latn
  content: This recommended practice specifies a structured framework for integrating
    Generative Pre-trained Transformer (GPT) into the software engineering life cycle
    (SELC). It defines intelligence levels, competency requirements, and evaluation
    methods for GPT-powered software development, covering all stages from requirements
    analysis, design, coding, and testing to delivery and operation. The framework
    is intended to help organizations assess, plan, and govern the progressive adoption
    of GPT-based capabilities in engineering practice.
