abstract:
- language: en
  script: Latn
  content: This guide documents accepted protection practices for transmission-to-generation
    interconnections. It is intended to cover the protection system applications at
    the interconnections between transmission systems and generation facilities greater
    than 10 MVA. This guide does not cover distributed energy resources.
