abstract:
- language: en
  script: Latn
  content: Recommended practices for communication and interoperation of devices connected
    on an electric power substation Internet Protocol (IP) network are provided. An
    introduction to the concepts that need to be mastered as well as specific recommendations
    to follow when deploying the technologies are provided for the power engineer
    new to IP networking. Direction and requirements to facilitate interoperable electric
    utility information networks are provided for equipment manufacturers and system
    integrators.
