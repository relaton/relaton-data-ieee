abstract:
- language: en
  script: Latn
  content: Specifications for rectangular metallic waveguides operating at 110 GHz
    and above (including aperture dimensions, frequency range, cut-off frequency,
    etc.) are given in this standard. The tolerances of the waveguide aperture dimensions
    and the effect these have on the electrical performance (in terms of reflection
    coefficient, attenuation constant, etc.) of the waveguide are also considered.
