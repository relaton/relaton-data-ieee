abstract:
- language: en
  script: Latn
  content: This standard defines a text description method for neural networks. Data
    requirements, basic unit in neural networks, schemas for neural network architectures,
    and application scenarios are also discussed. Institutions, enterprises and researchers
    that describe neural network architecture follow the general description method
    outlined here. With this standard, newly generated neural network architectures
    could be easily shared and exchanged. This would make neural network algorithms
    very easily transferred because they will not depend on the particular neural
    network platform or libraries.
