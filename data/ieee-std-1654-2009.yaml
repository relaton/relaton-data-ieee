abstract:
- language: en
  script: Latn
  content: This guide presents information on establishing an effective safety program
    to assure compliance with the applicable regulations for radio frequency (RF)
    protection of electrical workers in the vicinity of wireless communication antennas
    adjacent or attached to electrical power line structures. The guide also provides
    information on power frequency electric and magnetic field immunity of RF personal
    monitors and RF protective clothing.
