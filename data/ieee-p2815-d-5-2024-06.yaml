abstract:
- language: en
  script: Latn
  content: The general functional and technical specifications of the smart distribution
    transformer terminal (as a device) used in distribution network monitoring and
    operation are provided in this guide. Various functions and recommendations of
    its environmental aspect, power supply, communication, and information exchange
    interface, hardware and software platform, and application cases are addressed.
