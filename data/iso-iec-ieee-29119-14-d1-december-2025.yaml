abstract:
- language: en
  script: Latn
  content: The purpose of ISO/IEC/IEEE 29119 (all parts) is to define an internationally
    agreed set of standards for software testing that can be used by any organization
    when performing any form of software testing. This document defines test processes,
    test documentation and test approaches that are relevant to data migration testing.
    The processes defined in this document can be used in conjunction with any software
    development lifecycle model.
