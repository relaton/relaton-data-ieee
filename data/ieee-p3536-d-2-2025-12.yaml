abstract:
- language: en
  script: Latn
  content: Space missions face an increasing level of adversarial threats, making
    security a more critical concern than ever before. With space becoming congested
    and contested, the success and safety of these missions rely heavily on the security
    and resilience of these complex systems. This standard defines a component-level
    technical design process for developing secure space systems.
