abstract:
- language: en
  script: Latn
  content: 'The basic technical guidelines of electric vehicle load forecasting for
    dispatching systems and load aggregation platforms are specified in this guide.
    It includes: forecasting scope, data sources, charging load data correction, charging
    load analysis, sensitivity analysis of charging load influencing factors, short-term
    charging load forecasting, and super short-term charging load forecasting. At
    the same time, this guide specifies the requirements for statistical analysis,
    predictive evaluation, and functional interface based on prediction methods and
    consumer technologies.'
