abstract:
- language: en
  script: Latn
  content: This dictionary defines terms in the field of Mathematics of Computing.
    Topics covered include Boolean algebra, number systems, computer arithmetic, complementation,
    shifts, arithmetic errors, error detection and correction, number conversions,
    numeric codes, mathematical notation, and basic mathematics. Every effort has
    been made to include all terms in general usage in this field.
