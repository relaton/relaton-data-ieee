abstract:
- language: en
  script: Latn
  content: This standard adopts MPAI Technical Specification Version 1.4 as an IEEE
    Standard. The Moving Picture, Audio and Data Coding by Artificial Intelligence
    (MPAI) Technical Specification Context-based Audio Enhancement (CAE) Version 1.4
    is a collection of four use cases specifying AI-based technologies for audio-related
    applications including entertainment, communication, post-production, teleconferencing,
    and restoration.
