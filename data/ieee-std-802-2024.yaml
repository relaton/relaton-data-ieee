abstract:
- language: en
  script: Latn
  content: An overview to the family of IEEE 802® standards is provided in this standard.
    It describes the reference models for the IEEE 802 standards and explains the
    relationship of these standards to the higher layer protocols; it specifies the
    structure of IEEE 802 MAC addresses; it specifies identification of public, private,
    prototype, and standard protocols; it specifies an object identifier hierarchy
    used within IEEE 802 for uniform allocation of object identifiers used in IEEE
    802 standards; and it specifies a method for higher layer protocol identification.
    (The PDF of this standard is available at https://ieeexplore.ieee.org/browse/standards/get-program/page/series?id=68
    through the IEEE GET program.)
