abstract:
- language: en
  script: Latn
  content: A power delivery connection between a power adapter and a power using devicegreater
    than 10 W and up to, but less than 240 W, is defined in this standard. A communicationslink
    between the power adapter and the mobile power-using device is also defined. Thecommunications
    may be used to coordinate the power delivery and provide identification betweenthe
    power adapter and the power-using device. While intended for portable computing
    andentertainment devices, power adapters conforming to this standard may also
    be used with otherdevices (including simple devices, with no communications capabilities,
    up to 20 W).
