abstract:
- language: en
  script: Latn
  content: These recommended practices are intended as a reference document for use
    by members of cement industry electrical maintenance departments. The procedures
    necessary for an efficient maintenance operation are summarized, and detailed
    information on maintenance procedures for many of the electrical devices more
    commonly found in the cement industry is provided.
