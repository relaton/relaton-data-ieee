abstract:
- language: en
  script: Latn
  content: 'This standard establishes general comfort requirements for XR devices,
    addressing three aspects: industrial design, display, and interaction design.
    The industrial design requirements specify tolerable ranges for equipment weight,
    size, operating temperature, humidity, center of gravity, inter-pupillary distance,
    and other physical structure factors. Display quality requirements focus on ergonomic
    aspects, including necessary and maximum brightness, luminance contrast, minimal
    refresh rate, pixels per degree, tolerable distortion, flicker, field of view,
    color uniformity, and binocular parallax. Interaction design requirements emphasize
    user interface response time fluency and pose data accuracy. The purpose of this
    standard is to provide technical guidance to manufacturers for designing comfortable
    and efficient XR devices, enhance user experience for prolonged use in work, learning,
    entertainment, or gaming, and facilitate improved communication among XR devices
    researchers and developers to advance the field. This standard is not contingent
    upon the completion of any other standard.'
