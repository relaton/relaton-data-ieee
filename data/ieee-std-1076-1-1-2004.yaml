abstract:
- language: en
  script: Latn
  content: This standard defines a collection of VHDL 1076.1 packages, compatible
    with IEEE Std 1076.1TM-1999, along with recommendations for conforming use, in
    order to facilitate the interchange of simulation models of physical components
    and subsystems. The packages include the definition of standard types, subtypes,
    natures, and constants for modeling in multiple energy domains (electrical, fluidic,
    mechanical, etc.).
