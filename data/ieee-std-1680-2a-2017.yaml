abstract:
- language: en
  script: Latn
  content: 'The following three criteria: "Required&#8212;End-of-life processing requirements"
    (currently 4.6.2.1); "Optional&#8212;Manufacturer recyclers or reuses toner material
    collected through its cartridge and container take-back program" (currently 4.9.3.2);
    and "Optional&#8212;Manufacturer recyclers or reuses plastics collected through
    its cartridge and container take-back program" (currently 4.9.3.3) are revised
    in this amendment.(The PDF of this standard is available to you at no cost to
    you, sponsored by Green Electronics Council, through the IEEE GET Program https://ieeexplore.ieee.org/browse/standards/get-program/page)'
