abstract:
- language: en
  script: Latn
  content: Guidance in the use of the signal and test definition (STD) standard is
    provided. STD provides the means to define and describe signals used in testing.
    This guide describes how to implement, apply, and use a set of common basic signals
    to form complex signals usable across all test platforms.
