  script: Latn
  content: Terms and definitions encompassing products within the scope of ac (48.3
    kV and below for air insulated equipment, 52 kV and below for gas insulated equipment)
    and dc (3.2 kV and below) power switchgear assemblies, including components for
    switching, interrupting, metering, protection, and regulating purposes as used
