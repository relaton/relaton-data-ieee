abstract:
- language: en
  script: Latn
  content: Communication protocols, terminology, metadata requirements, cybersecurity
    procedures, and data access controls to support global interoperability among
    industry participants are defined in this standard. It establishes a common language
    for the creation, consumption, transformation, and exchange of human body data
    and modeled humanoids, including associated apparel and wearable representations
    through the concepts of covers and coveroids. By promoting standardized data interoperability,
    the standard enables greater flexibility, transparency, functionality and performance
    across data systems. The standard does not specify scanning technologies, hardware,
    software, data-capture methods, imaging systems, medical equipment, or the algorithms
    used to generate humanoids or coveroids.
