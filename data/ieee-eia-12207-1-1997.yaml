abstract:
- language: en
  script: Latn
  content: ISO/IEC 12207 provides a common framework for developing and managing software.
    IEEE/EIA 12207.0 consists of the clarifications, additions, and changes accepted
    by the Institute of Electrical and Electronics Engineers (IEEE) and the Electronic
    Industries Association (EIA) as formulated by a joint project of the two organizations.
    IEEE/EIA 12207.1 provides guidance for recording life cycle data resulting from
    the life cycle processes of IEEE/EIA 12207.0.
