abstract:
- language: en
  script: Latn
  content: This guideline establishes a unified and standardized evaluation indicator
    and method system for Industrial Large Language Models (E-LLM) in power scenarios.
    Addressing the deficiency of professional scenario-specific evaluation criteria
    for current industrial large models, it provides an objective basis for assessing
    the performance of E-LLM in power-related application scenarios, reduces model
    application risks, and promotes the in-depth integration of large language model
    technologies with power business scenarios. The guideline clarifies the evaluation
    requirements, dimensions, indicators, and methods for E-LLM, focusing on their
    performance assessment across diverse power industry application scenarios. It
    is applicable to guiding the research and development as well as capability evaluation
    of E-LLM.
