abstract:
- language: en
  script: Latn
  content: The MAC Service and the Internal Sublayer Service (ISS) are defined in
    this standard. This standard specifies media-dependent convergence functions that
    map IEEE 802(R) MAC interfaces to the ISS. The MAC Service is derived from the
    ISS. (The PDF of this standard is available at no charge compliments of the IEEE
    GET Program https://ieeexplore.ieee.org/browse/standards/get-program/page)
