abstract:
- language: en
  script: Latn
  content: Information on the selection, application, operation, and maintenance of
    single-or multi-pole AC automatic circuit reclosers is provided. The principle
    characteristics of reclosers are identified, and the necessary system information
    is indicated. Step-by-step procedures for selecting reclosers for specific applications
    are given.
