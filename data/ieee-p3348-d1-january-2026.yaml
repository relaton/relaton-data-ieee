abstract:
- language: en
  script: Latn
  content: This standard provides framework and guidance for individuals and organizations
    to develop systems for generating 20 real-person digital clothes models based
    on Al. the framework includes functional modules and the input/output interfaces
    of the 20 real-person digital clothes model generation system. The framework includes
    modules for digital model face generation, clothes generation, digital model posture
    generation, and image fusion. Methods for evaluating the generated 20 real-person
    digital clothes models are specified.
