abstract:
- language: en
  script: Latn
  content: Recommended practices for ethical usage of emulated empathy in general-purpose
    artificial intelligence (GPAI) systems for human-artificial intelligence (AI)
    partnerships are provided in this standard. The use of emulated empathy in GPAI
    systems for human-AI partnerships refers to general-purpose AI products marketed
    as empathic partners, personal AI, companions, co-pilots, agents, assistants,
    and related phrasing for human-AI partnering. IEEE Std 7014.1™ is a domainspecific
    extension of IEEE Std 7014™, IEEE Standard for Ethical Considerations in Emulated
    Empathy in Autonomous and Intelligent Systems. Whereas IEEE Std 7014 provides
    overarching principles for ethical evaluation of emulated empathy across AI, IEEE
    Std 7014.1 focuses on the overlap of GPAI, emulated empathy and human-AI partnering.
