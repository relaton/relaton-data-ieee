abstract:
- language: en
  script: Latn
  content: Systems engineering agility is a strategy-based method for designing, building,
    sustaining, and evolving purpose-fulfilling creations when knowledge is uncertain
    and operational environments are dynamic. Strategies are abstractions for what
    needs to be accomplished and why, without constraints or directions on how to
    achieve them. This part of ISO/IEC/IEEE 24748 specifies strategic aspects supporting
    systems engineering agility. It includes guidelines for the application of the
    strategic aspects as well as relevant examples. Individually and collectively,
    the aspects can improve capability to deal with uncertain knowledge and dynamic
    environments.
