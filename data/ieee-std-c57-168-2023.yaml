abstract:
- language: en
  script: Latn
  content: Provided in this guide for low frequency dielectric testing for distribution,
    power, and regulating transformers are background on various low frequency test
    methods as well as guidance on how to conduct and interpret the results. Common
    pitfalls to avoid are presented along with compiled guidance on interpreting the
    results and possible methods for correcting test issues.
