abstract:
- language: en
  script: Latn
  content: This standard is established as a comprehensive operational framework for
    data and artificial intelligence literacy, skills, and readiness. Essential competencies
    are defined across multiple proficiency levels to help ensure individuals and
    organizations are empowered in an increasingly data- and AI-driven society. A
    common set of definitions, language, and understanding of data and AI literacy
    is provided, allowing for systematic inclusion in educational curricula and training
    programs. By the framework, policy interventions are enabled, progress is tracked,
    and outcomes are evaluated through measurable indicators. Through the standardization
    of these competencies, data and AI literacy is intended to be made a core component
    of modern education and professional development, facilitating ethical and responsible
    engagement with these technologies.
