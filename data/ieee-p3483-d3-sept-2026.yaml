abstract:
- language: en
  script: Latn
  content: This standard introduces a unified coding framework for deep intermediate
    feature tensors generated by deep neural networks, including but not limited to
    convolutional neural networks, transformer-based networks, and diffusion models.
    The standard specifies normative bitstream syntax and coding procedures for feature
    tensor representation, pre-quantization, feature tensor repacking, codec-based
    compression, bitstream packaging, and the corresponding decoding processes.
