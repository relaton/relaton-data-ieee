abstract:
- language: en
  script: Latn
  content: This recommended practice defines the concepts, techniques, benchmark models,
    validation procedures, uncertainties and limitations of computational electromagnetics
    techniques and tools used for modeling and simulation of antennas in free space.
    It recommends and provides guidance on the numerical modeling of antennas and
    benchmark results to verify the general approach for the numerical simulations
    of such antennas. It defines acceptable numerical modeling requirements and guidance
    on meshing.
