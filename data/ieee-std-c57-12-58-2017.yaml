abstract:
- language: en
  script: Latn
  content: General recommendations for measuring voltage transients in dry-type distribution
    and power transformers are provided. Recurrent surge voltage generator circuitry,
    instrumentation, test sample, test point location, mounting the test coil, conducting
    the test, and reporting results are covered.
