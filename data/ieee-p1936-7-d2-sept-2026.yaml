abstract:
- language: en
  script: Latn
  content: This standard establishes uniform requirements for the mesh deployment
    of multi-rotor UAS in the inspection of overhead transmission and distribution
    lines and outdoor substation facilities, covering the workflow, procedure, technical
    parameters, segmentation of the inspection area, UAS dock location selection,
    route planning, the leapfrog method, and inspection task scheduling.
