abstract:
- language: en
  script: Latn
  content: The following information is intended to bring together a brief description
    of basic electrical practices in regard to the application and installation of
    auxiliary devices to motors operating in Class 1, Groups A, B, C, and D, Division
    2 areas. It should be understood that this information is only a guide to promote
    consistent application of such devices and must be used with sound engineering
    judgment.
