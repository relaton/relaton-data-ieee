abstract:
- language: en
  script: Latn
  content: This project will develop an XML application defining a standard language
    for symbolic music representation. The language will be a meta-representation
    of music information for describing and processing said music information within
    a multi-layered environment, for achieving integration among structural, score,
    MIDI, and digital sound levels of representation. Furthermore, the proposed standard
    should integrate music representation with already defined and accepted common
    standards. The standard will be accepted by any kind of software dealing with
    music information, e.g. score editing, OMR systems, music performance, musical
    databases, and composition and musicological applications.
