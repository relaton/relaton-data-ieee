abstract:
- language: en
  script: Latn
  content: Requirements for a software developer's quality management system are established.
    Each of the elements of a quality management system to be designed, developed,
    and maintained by the developer are identified, with the objective of ensuring
    that the software will meet the requirements of a contract, purchase order, or
    other agreement (collectively referred to as a contract).
