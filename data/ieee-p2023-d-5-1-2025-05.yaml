abstract:
- language: en
  script: Latn
  content: An architecture and framework for digital transformation are provided by
    this standard. The need for a comprehensive plan for effective digital transformation
    that addresses the people element, the process element, and the digital technologies
    is identified by this standard. Each of these three elements are covered in more
    detail. Leadership and workforce management issues associated with organizational
    change management are addressed by the people element. The impact on business
    processes is discussed in the process clause. In addition, the application of
    business process changes in different types of business operations are addressed.
    A brief overview of the technologies most commonly associated with digital transformation
    is provided in the technology clause. The impact these technologies can have within
    a business is reviewed. Finally, organizational sustainability and its close interconnection
    with digital transformation is presented.
