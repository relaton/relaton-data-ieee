abstract:
- language: en
  script: Latn
  content: Testing, calibration, and calibration frequency requirements for portable
    radiation detectors used to directly measure α, β, photon, and neutron radiation
    are defined. Also defined are the calibration and testing requirements for α and
    β-gamma measurements of surface contamination levels using portable radiation
    detectors.
