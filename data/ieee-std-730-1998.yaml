abstract:
- language: en
  script: Latn
  content: Uniform, minimum acceptable requirements for preparation and content of
    Software QualityAssurance Plans (SQAPs) are provided. This standard applies to
    the development and maintenance of critical software. For non-critical software,
    or for software already developed, a subset of the requirements of this standard
    may be applied.
