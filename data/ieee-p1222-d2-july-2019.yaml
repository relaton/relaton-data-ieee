  script: Latn
  content: The construction, mechanical, electrical, and optical performance, installation
    guidelines, acceptance criteria, test requirements, environmental considerations,
    and accessories for a nonmetallic, all-dielectric self-supporting (ADSS) fiber
    optic cable are covered by this standard. The ADSS cable is designed to be located
    primarily on overhead utility facilities.
