abstract:
- language: en
  script: Latn
  content: This Guide covers general recommendations for the operation, loading, and
    maintenance of turbine-driven synchronous generators of the types specified in
    Section 4, having cylindrical rotors and conventional cooling systems (in distinction
    from conductor-cooled systems). It does not apply to generators having salient-pole
    rotors.
