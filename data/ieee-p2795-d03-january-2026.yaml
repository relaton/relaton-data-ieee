abstract:
- language: en
  script: Latn
  content: This standard is intended to be used to identify requirements for trusted
    high-assurance analytic exchange services over secured and unsecured networks.
    Metadata and frameworks used to support interactions between nodes involved in
    a trusted multipart handshake are defined in this standard, including the discovery
    of data models and processing aspects available at a remote location, appropriate
    analytic configuration, and the exchange of vetted critical analytic results.
    The exchange of trusted, actionable, and appropriate information between analytic-producing
    and analytic-consuming nodes is supported by this standard. The multipart handshake
    is designed for use between computing nodes operating in potentially denied, disrupted,
    intermittent, and limited bandwidth environments. These environments may involve
    critical infrastructure (e.g., medical, transportation, and utilities) and may
    include austere computing environments such as those present in IoT and industrial
    control systems. Other applications that employ analytic exchanges are not precluded
    by this standard.
