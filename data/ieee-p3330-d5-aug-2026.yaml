abstract:
- language: en
  script: Latn
  content: This standard defines the syntax of Shape Expression schemas represented
    in JavaScript Object Notation (JSON), Resource Description Framework (RDF) and
    plain text. This standard includes formal semantics for validation of RDF knowledge
    graphs using Shape Expressions. This validation process includes the definition
    of ShapeMaps to associate nodes in RDF graphs with labeled Shape Expressions.
    A test suite covers all aspects of syntax and validation.
