abstract:
- language: en
  script: Latn
  content: This standard establishes a unified terminology and conceptual reference
    framework for specifying Brain-Computer Interfaces (BCIs). BCIs are deployed in
    diverse application domains, and they engage multidisciplinary teams who bring
    different perspectives to the technical, organic, and operational components of
    BCI. Ambiguous references hinder cross-sector innovation, and they also hinder
    mainstream deployment, which relies on clearly defined and universally agreed
    standards for documentation, validation, regulation, and compliance. All these
    factors contribute to the need for a common conceptual framework that applies
    to every application of BCI.
