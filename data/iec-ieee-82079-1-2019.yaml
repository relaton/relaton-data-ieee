abstract:
- language: en
  script: Latn
  content: 'Information for use is a part of any type of product it supports. Confusing
    product information and inadequate instructions are major sources of frustration
    for consumers and skilled workers. Defective information can pose a risk of harm
    or loss, leading to prosecution or liability claims against the supplier or brand
    owner. This document gives principles and general requirements for conveying information
    to users that are as applicable to complex and safety-critical systems (e.g. industrial
    plants), as they are to simple consumer products (e.g. a can of paint), to software,
    and to specialized testing equipment. Information for use is needed for anyone
    (skilled and unskilled) who encounters a product for the first time: whether to
    assemble from a kit, install, operate, maintain, or dispose of it.'
