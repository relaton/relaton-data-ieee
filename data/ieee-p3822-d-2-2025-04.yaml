abstract:
- language: en
  script: Latn
  content: This standard defines a blockchain-based framework for computational resource
    trading for the digital finance field. The framework provides flexible, efficient,
    and secure computational resource trading. The standard defines the terminology,
    technical requirements, computational resource trading mechanism, and the roles
    and functions of resource providers, resource users, and trading platforms. The
    standard outlines the computational resource trading framework through a reference
    model. The consumers of this standard include Internet companies and computational
    resources trading platforms.
