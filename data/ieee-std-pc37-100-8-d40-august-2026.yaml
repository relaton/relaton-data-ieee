abstract:
- language: en
  script: Latn
  content: There have been inconsistencies in the claims of the expected life of lubricants
    as used in switchgear equipment. Thus, there is a need to standardize how to determine
    the expected life of lubricants. This guide provides methodologies that may be
    used to establish the expected life of lubricants as used in switchgear equipment.
