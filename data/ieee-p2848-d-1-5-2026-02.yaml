abstract:
- language: en
  script: Latn
  content: This standard defines data elements required to support prognostics and
    health management in the context of automatic test systems. The standard draws
    upon existing data elements defined in companion standards, such as IEEE Std 1636
    and IEEE Std 1671 to form a basis for PHM in ATS. It then proposes additional
    relationships and entities within XML schemas to enhance previously defined, standard
    XML schemas in the ATS domain to support PHM processes. Target users of this standard
    include developers of PHM tools, developers of ATS, maintainers using PHM-enabled
    ATS systems, and maintenance operations responsible for logistics planning of
    ATS resources and UUTs.
