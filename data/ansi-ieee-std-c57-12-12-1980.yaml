abstract:
- language: en
  script: Latn
  content: Large, oil-immersed power transformers with high-voltage windings rated
    345 kV and above are considered. Inspection on receipt, internal inspection at
    the site, preliminary oil filling, assembly, vacuum treatment and final filling,
    vacuum drying of insulation, recirculation, and energization are covered.
