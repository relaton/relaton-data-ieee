abstract:
- language: en
  script: Latn
  content: This standard provides comprehensive testing and acceptance technical guidance
    for hydrogen cylinder valves of unmanned aircraft systems (UASs) in low-temperature
    environments for UAS users, hydrogen cylinder manufacturers, valve manufacturers,
    and other enterprises. It elaborates on relevant terms, definitions, technical
    requirements, test methods, and evaluation criteria, and is applicable to the
    verification of hydrogen cylinder valves of UASs in ambient temperatures ranging
    from –50 °C to –10 °C.
