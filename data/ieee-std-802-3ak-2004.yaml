abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2002 as amended by IEEE Std 802.3ae-2002,
    IEEE Std 802.3af-2003 and IEEE Std 802.3aj-2003 specifies a new physical layer
    medium dependent sublayer interface for 10Gb/s Ethernet. 10GBASE-CX4 specifies
    an equipment interconnect based on the 10 Gigabit Attachment Unit Interface (XAUI)
    for up to 15m of balanced shielded cabling.
