abstract:
- language: en
  script: Latn
  content: In this amendment to IEEE Std 802.15.4TM-2011, a physical layer for IEEE
    802.15.4 in the 2360 MHz to 2400 MHz band which complies with Federal Communications
    Commission (FCC) MBAN rules is defined. Modifications to the MAC needed to support
    this new physical layer are also defined in this amendment.
