abstract:
- language: en
  script: Latn
  content: Recommended practices for system design, storage, installation, ventilation,
    instrumentation, operation, maintenance, capacity testing, and replacement of
    Li-ion batteries are provided in this document. While the principles covered in
    this document apply to all stationary standby and cycling applications, some of
    them may be excessive for smaller systems, such as those often found in residential
    installations. Guidance on compliance with safety standards, as well as best practices
    for worker safety during installation, maintenance, and testing is also provided.
