abstract:
- language: en
  script: Latn
  content: 'The test requirements for system commissioning, applicable to dc (direct
    current) distribution networks with voltage levels from 750 V to ±50 kV, are specified
    in this guide. Included in the guide are the following aspects: converter [ac
    (alternating current)/dc, dc/dc] test; dc circuit breaker test; test of active
    and passive network conversion; test of the operation characteristics of low voltage
    dc islanded operation system; test of feeder power balance system; coordinated
    operation test of medium and low voltage dc system; plug and play system test;
    small power system test; large power system test; rated load test; overload test;
    short circuit test; and trial operation.'
