abstract:
- language: en
  script: Latn
  content: It is widely accepted that one of the most significant contaminants affecting
    the performance of liquid-immersed transformers is moisture. Because of its importance,
    many standards and guides give various descriptions of the effects of moisture,
    recommendations on the acceptable levels of moisture, recommendations for the
    determination of moisture, and moisture mitigation techniques. State-of-the-art
    knowledge for moisture-related parameters in liquid-immersed transformers has
    been consolidated in this guide, which is intended to serve as a reference for
    use by other standards and guides.
