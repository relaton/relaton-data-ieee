abstract:
- language: en
  script: Latn
  content: With the development of artificial intelligence (AI) technology, the performance
    of voice interaction systems in smart home devices has been significantly improved.
    However, against the backdrop of the booming development of new products, there
    is still a lack of specifications and evaluation methods in the market to assess
    the performance of these products. Therefore, an evaluation system to judge the
    capabilities of smart home voice interaction systems from four dimensions--speech
    processing, semantic analytics, AI skills, and user interactive experience--is
    constructed by this standard.
