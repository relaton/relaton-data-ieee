- language: en
  script: Latn
  content: This guide covers the application of air gap, gas tube, metal oxide varistor,
    and avalanche junction semiconductor components used in surge protective devices,
    equipment, or systems involving low-voltage power, data, communications and signaling
    circuits. This guide is intended to be used with, or to complement, related documents
    IEEE C62.31, C62.32, C62.33 and C62.35.
