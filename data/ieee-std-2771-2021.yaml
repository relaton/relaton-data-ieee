abstract:
- language: en
  script: Latn
  content: Operating voltage, overvoltage, and sustained dc arc current of dc earth
    electrode lines are introduced in this guide. Technical conditions of arcing horns
    are discussed, including gap spacing, structures, materials, and layout. In addition,
    tests for arcing horns are recommended.
