abstract:
- language: en
  script: Latn
  content: This standard defines a technical 1 framework, application procedure, and
    management requirements for carbon accounting utilizing blockchain technology.
    It outlines principles for leveraging blockchain technology in carbon accounting,
    providing a detailed technical framework encompassing planning, design, construction,
    and operation of the system. It includes requirements for data collection, data
    interaction, emission factor database, quantification methodologies and validation/verification
    procedures for carbon emissions.
