abstract:
- language: en
  script: Latn
  content: 'Withdrawn Standard. Withdrawn Date: Feb 06, 2006. Recommendations on hopper
    heating system performance and equipment requirements necessary to provide an
    economical and effective hopper heating system are presented. System characteristics
    are described, and heat transfer analysis is covered. Heating module design considerations
    are presented. Control, monitoring, and alarm systems are discussed. Insulation,
    installation, operation, and maintenance are addressed.'
