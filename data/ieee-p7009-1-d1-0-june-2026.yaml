abstract:
- language: en
  script: Latn
  content: This standard defines capabilities to assist operational autonomous and
    semi-autonomous systems preserve freedom from unacceptable risk of harm. When
    realized as an integral element of an operational Safety Management System, the
    capabilities documented in this standard provide a basis for interventions to
    assist management of safety in the event that systems operating either autonomously
    or semi-autonomously exhibit anomalous behavior.
