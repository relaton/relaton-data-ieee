abstract:
- language: en
  script: Latn
  content: 'Covered in this standard are conformance tests and requirements for the
    integrity ofabove-grade pad-mounted enclosures for application in coastal environments
    that containapparatus energized in excess of 600 V and that may be exposed to
    the public including, but notlimited to, the following types of equipment enclosures:
    pad-mounted capacitors or inductors, pad-mounted distribution transformers, pad-mounted
    junction enclosures, pad-mounted meteringequipment, pad-mounted switch gear.'
