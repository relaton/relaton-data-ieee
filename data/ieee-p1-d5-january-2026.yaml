abstract:
- language: en
  script: Latn
  content: The preparation of standards that are principally concerned with the thermal
    endurance of electrical insulating materials and simple combinations of such materials
    is intended to be served by this recommended practice; the establishment of limiting
    temperatures of electrical insulation systems is intended to be supported; and
    general principles for the thermal classification of electrical insulation systems
    are intended to be provided.
