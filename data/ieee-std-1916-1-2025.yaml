abstract:
- language: en
  script: Latn
  content: A framework to build and operate SDN/NFV delivery infrastructures that
    satisfies performance expectations of network operators, service/content providers,
    and end users is provided in this standard. In particular, a performance framework,
    including characteristics, metrics, requirements, models and use-cases for Software-Defined
    Networking and Network Function Virtualization, is specified in this standard.
