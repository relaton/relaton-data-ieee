abstract:
- language: en
  script: Latn
  content: In this IEEE standard a review of the generally accepted forms of relay
    protection for the synchronous generator and its excitation system is presented.
    This guide is primarily concerned with protection against faults and abnormal
    operating conditions for large hydraulic, steam, and combustion-turbine generators.
