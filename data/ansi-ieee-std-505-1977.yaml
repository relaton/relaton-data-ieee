abstract:
- language: en
  script: Latn
  content: 'Electric power systems in stationary generating stations that provide
    electric power to the power system are covered. Nomenclature is included for the
    following interrelated systems: generating unit power system, generating unit
    auxiliaries power system, station auxiliaries power system, generating unit dc
    auxiliaries power system, and station dc auxiliaries power system. Nomenclature
    for instrumentation, controls, or auxiliaries is not included.'
