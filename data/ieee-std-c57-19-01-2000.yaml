abstract:
- language: en
  script: Latn
  content: Electrical, dimensional, and related requirements for outdoor power apparatus
    bushings that have basic impulse insulation levels (BILs) of 200 kV and above
    are covered. Specific values for dimensional and related requirements that are
    to be interpreted, measured, or tested, in accordance with IEEE Std C57.19.00-1991,
    are provided.
