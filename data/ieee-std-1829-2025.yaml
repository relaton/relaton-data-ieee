abstract:
- language: en
  script: Latn
  content: 'Uniform procedures for the testing of ac transmission line and station
    bus hardware assemblies in high-voltage (&#x003E;100 kV) laboratories are established
    by this guide, Two tests are described by the guide: The first test is a corona
    performance test and the second is a radio interference voltage (RIV) test, Visible
    techniques to determine the onset of positive corona are used by the first test,
    The second test is a measurement of the RIV voltage according to ANSI C63.2 or
    CISPR 16-1-1 and CISPR 18-2, The permissible radio interference (RI) limits or
    specified corona extinction voltages are not addressed by this guide, They are
    set either by regulation or by agreement between the end user and hardware manufacturer'
