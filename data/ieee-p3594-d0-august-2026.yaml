abstract:
- language: en
  script: Latn
  content: This guide applies to extracting fragment data from naturalistic driving
    scenario. This guide specifies the data content, requirements, and methods for
    extracting naturalistic driving scenario data of the intelligent connected vehicles.
    The content and requirements for extracting data from scenarios in the guide should
    cover typical testing scenarios and meet the needs of various applications in
    scenarios. It covers all the processes involved in the scenario extraction process.
    It supplements the intelligent connected vehicle testing scenario database.
