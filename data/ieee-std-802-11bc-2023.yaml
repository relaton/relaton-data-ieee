abstract:
- language: en
  script: Latn
  content: Modifications to the IEEE 802.11 medium access control layer (MAC) for
    the enhanced transmission and reception of broadcast content, both while associated
    with an infrastructure basic service set (BSS) and while not associated with an
    infrastructure BSS, are defined in this amendment. IEEE 802.11-2020/Cor 2-2024
    was approved on February 15, 2024. This was included in this PDF and was not publishing
