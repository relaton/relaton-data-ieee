abstract:
- language: en
  script: Latn
  content: The standard develops data specifications for Internet of Food (IoF) system
    implementations. The unified data requirements underpin data sharing and interoperability
    within complex food supply chains. Data structure, coding scheme are also defined
    to help ensure interoperable, agile, and scalable network solutions and service
    delivery, and enables better traceability of food, leading to increased food safety.
