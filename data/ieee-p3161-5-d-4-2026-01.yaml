abstract:
- language: en
  script: Latn
  content: This standard defines reference architecture, functional and interface
    requirements of the algorithm and model repository for digital retina system (DRS).
    It specifies algorithm encapsulation and description requirements. It can be applied
    to the design and development of the algorithm and model repository, as well as
    the unified encapsulation, management, and execution of algorithms and models.
