abstract:
- language: en
  script: Latn
  content: Terms currently in use in the computer field are identified, and standard
    definitions are established for them. Terms were excluded if they were considered
    to be parochial to one group or organization, company-proprietary or trademarked,
    multiword terms whose meaning could be inferred from the definitions of the component
    words, or terms whose meaning in the computer field could be directly inferred
    from their standard English meaning.
