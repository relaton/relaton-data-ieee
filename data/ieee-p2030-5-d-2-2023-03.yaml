abstract:
- language: en
  script: Latn
  content: 'The application layer with TCP/IP providing functions in the transport
    and Internet layers to enable utility management of the end user energy environment,
    including demand response, load control, time of day pricing, management of distributed
    generation, electric vehicles, etc., is defined in this standard. Depending on
    the physical layer in use (e.g., IEEE 802.15.4&#8482;, IEEE 802.11&#8482;, IEEE
    1901&#8482;, IEEE 1901.2&#8482;), a variety of lower layer protocols may be involved
    in providing a complete solution. Generally, lower layer protocols are not discussed
    in this standard except where there is direct interaction with the application
    protocol. The mechanisms for exchanging application messages, the exact messages
    exchanged, including error messages, and the security features used to protect
    the application messages are defined in this standard. With respect to the Open
    Systems Interconnection (OSI) network model, this standard is built using the
    four-layer Internet stack model. Elements from many existing standards, including
    IEC 61968 and IEC 61850, are sourced and a RESTful architecture (Fielding [B2])
    using IETF protocols such as HTTP is followed by the defined application profile.
    Additional files available on downloads page: https://standards.ieee.org/wp-content/uploads/2024/12/2030.5-2023_downloads.zip'
