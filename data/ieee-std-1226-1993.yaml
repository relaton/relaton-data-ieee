abstract:
- language: en
  script: Latn
  content: Superseded. The overall concept of A Broad-Based Environment for Test (ABBET)
    is defined, and mandatory requirements for implementations ABBET are specified.
    The elements of ABBET and their interrelationships are described. Guidelines and
    requirements governing the elements of the ABBET set of standards and guides are
    established, and common terms to be used throughout the set are defined.
