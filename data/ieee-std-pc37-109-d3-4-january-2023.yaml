abstract:
- language: en
  script: Latn
  content: A guide to the methods and configurations for the protection of power system
    shunt reactors is provided in this guide. The protection of oil-immersed reactors
    equipped with auxiliary power windings, improved turn-to-turn fault protection,
    and use of digital (microprocessor-based) protection for shunt reactors are included.
