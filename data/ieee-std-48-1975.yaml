abstract:
- language: en
  script: Latn
  content: This standard covers all indoor and outdoor cable terminations used on
    alternating current cables having laminated or extruded insulation rated 2.5 kV
    through 500 kV, except seperable insulated connectors which are covered by [1].
    Cable terminations and component parts shall be capable of withstanding the test
    specified in this standard.
