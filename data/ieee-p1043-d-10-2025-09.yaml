abstract:
- language: en
  script: Latn
  content: IEEE Std. 1043™ provides a comprehensive framework for the voltage-endurance
    testing of form-wound bars and coils used in large rotating machine stator windings.
    This recommended practice outlines the procedures for conducting voltage endurance
    test on bars/coils with nominal voltage up to 30,000 V, and operating frequencies
    of 50 Hz or 60 Hz. The standard specifies power supply and voltage requirements,
    test set-up, specimen preparation, pre-test evaluation methods, as well as temperature
    and voltage application and measurement methods. The recommended practice also
    provides guidelines for failure investigations, suggested test records and test
    report requirements.
