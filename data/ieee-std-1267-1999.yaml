abstract:
- language: en
  script: Latn
  content: The technical requirements to engineer, design, specify, fabricate, manufacture,
    furnish,install, test, commission, and provide as-built documents for air-insulated
    substations are covered.This guide investigates the methods, practices, and requirements
    of both users and suppliers in order to promogate a systematic and coordinated
    approach for development of specifications for turn-key substation projects.
