abstract:
- language: en
  script: Latn
  content: This draft is an amendment of IEEE Std 802.3-2012. It provides physical
    layer specifications andmanagement parameters for EPON operation on point-to-multipoint
    passive optical networks supportingextended power budget classes of PX30, PX40,
    PRX40, and PR40. This draft is prepared by the IEEEP802.3bk Extended EPON Task
    Force for the first IEEE Sponsor Ballot. This draft expires 6 months afterthe
    date of publication or when the next version is published, whichever comes first.
