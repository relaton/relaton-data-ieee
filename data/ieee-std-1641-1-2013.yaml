abstract:
- language: en
  script: Latn
  content: Guidance in the use of the signal and test definition (STD) standard, IEEE
    Std 1641-2010, is provided. IEEE Std 1641 provides the means to define and describe
    signals used in testing. This guide describes how to form complex signals usable
    across all test platforms.
