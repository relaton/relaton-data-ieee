abstract:
- language: en
  script: Latn
  content: 'The C62.42 guide series covers surge protective components (SPCs) used
    in power and telecom surge protective devices (SPDs) and equipment ports. This
    part on Gas Discharge Tube (GDT) technology SPCs covers: Component construction
    Characteristics Ratings Application examples The application examples are given
    in two informative Annexes covering: basic circuits and protection circuits specific
    to communications, local area networks, high frequency feeds and industrial services.'
