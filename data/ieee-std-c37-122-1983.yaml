abstract:
- language: en
  script: Latn
  content: Superseded by C37.122-1993.. The technical requirements for the design,
    fabrication, testing, and installation of a gasinsulated substation (GIS) are
    covered. The parameters to be supplied by the purchaser are set, and the technical
    requirements for the design, fabrication, testing, and installation to be furnished
    by the manufacturer are established.
