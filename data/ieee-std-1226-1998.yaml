abstract:
- language: en
  script: Latn
  content: The overall concept of A Broad-Based Environment for Test (ABBET)/sup TM/
    is defined, and mandatory requirements for implementation of ABBET are specified.
    The elements of ABBET and their interrelationships are described. Guidelines and
    requirements governing the elements of the ABBET set of IEEE standards and guides
    are established, and common terms to be used throughout the set are defined.
