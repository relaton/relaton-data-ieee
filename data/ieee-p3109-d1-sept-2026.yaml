abstract:
- language: en
  script: Latn
  content: This standard defines binary arithmetic and data formats optimized for
    machine learning domains. Compact binary floating-point interchange formats are
    specified, parameterized by bitwidth, precision, signedness, and domain. Operations
    including rounding with saturation modes and conversion between P3109 formats
    and IEEE Std 754™formats are defined. A consistent and flexible arithmetic framework
    is provided for machine learning systems in hardware and software implementations.
