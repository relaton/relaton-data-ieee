abstract:
- language: en
  script: Latn
  content: The purpose of this international standard is to define a generic process
    for incident management that can be used by any organization when performing any
    form of software and systems development, testing or operations. The processes
    defined in this document can be used in conjunction with any development life
    cycle model (e.g. incremental, waterfall, evolutionary, agile).
