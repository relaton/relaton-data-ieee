abstract:
- language: en
  script: Latn
  content: Self-discipline and professional ethics of cryptocurrency exchange platforms,
    as well as relevance between them and to cryptocurrency wallets are covered in
    this standard. Exchange business logic, operational procedures, user authentication
    programs are also covered in this standard. In addition, a small but necessary
    technical category of requirements, including terminologies, basic architectural
    framework, key indicators, end-user interface specifications, in order to achieve
    the previously mentioned goals is covered in this standard.
