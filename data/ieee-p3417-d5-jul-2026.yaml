abstract:
- language: en
  script: Latn
  content: This standard specifies the technical architecture, requirements, and evaluation
    methods for using differential privacy to protect user personal information in
    data processing. It defines three deployment models (central, local, and shuffle),
    establishes technical requirements covering basic capability, data security, algorithm
    security, and scenario-based security, and provides a three-level protection classification
    scheme. Test and evaluation methods for verifying conformance are also specified.
