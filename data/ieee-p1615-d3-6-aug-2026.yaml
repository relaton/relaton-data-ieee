abstract:
- language: en
  script: Latn
  content: Recommended practices are provided for a substation Local Area Network
    (LAN) including serial communications. An introduction to the concepts that should
    be mastered as well as specific recommendations to follow when deploying the technologies
    are provided for the power engineer new to networking. Direction and requirements
    to facilitate interoperable substation LANs are provided for manufacturers and
    system integrators.
