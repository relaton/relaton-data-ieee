abstract:
- language: en
  script: Latn
  content: Reaffirmed 2008. Letter symbols for physical quantities used in the science
    and technology of acoustics are covered. Abbreviations for a number of acoustical
    levels and related measures that are in common use are also given. The symbols
    given in this standard are intended for all applications.
