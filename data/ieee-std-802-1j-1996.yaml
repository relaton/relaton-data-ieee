abstract:
- language: en
  script: Latn
  content: 'Managed object classes and their components that permit remote management
    of ISO/IEC 10038-conformant MAC bridges by means of suitable management protocols,
    including the services and protocols defined in ISO/IEC 15802-2: 1995, LAN/MAN
    Management; and those defined in ISO/IEC 9595: 1991, CMIS; and ISO/IEC 9596-1:
    1991, CMIP; are defined. The managed object definitions are documented in the
    notation defined in ISO/IEC 10165-4: 1992, GDMO.'
