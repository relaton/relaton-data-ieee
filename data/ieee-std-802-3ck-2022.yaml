abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-202x adds Clause 161 through Clause 163,
    Annex 120F, Annex 120G, and Annex 162A through Annex 162D, Annex 163A, and Annex
    163B. This amendment includes Physical Layer specifications and management parameters
    for 100 Gb/s, 200 Gb/s, and 400 Gb/s electrical interfaces based on 100 Gb/s signaling.
