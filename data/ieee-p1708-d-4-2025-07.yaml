abstract:
- language: en
  script: Latn
  content: A normative definition of wearable cuffless blood pressure (BP) measuring
    devices and the objective performance evaluation of this kind of device are established
    in this standard. This standard is independent of the form of the device or the
    vehicle to which the device is attached or in which it is embedded. All types
    of wearable BP measurement devices, including epidermal and unobtrusive devices
    with different modes of operation (e.g., short‑term, long‑term, snapshot, continuous,
    beat‑to‑beat BP, or BP‑variability measurement), are covered by this standard.
    This standard is, however, limited to the evaluation of devices in which a cuff
    is not used during measurement, and the evaluation of all sphygmomanometers that
    are used with an occluding or inflatable cuff for the indirect determination of
    BP on the upper arm or wrist is not covered. Guidelines are provided in this standard
    for manufacturers to qualify and validate their products, potential purchasers
    or users to evaluate and select prospective products, and health care professionals
    to understand the manufacturing practices of wearable BP devices.
