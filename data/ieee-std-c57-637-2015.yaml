abstract:
- language: en
  script: Latn
  content: 'Covered in this guide are: mineral insulating oil commonly defined as
    transformer oil; definitions and descriptions of reclaiming procedures; the test
    methods used to evaluate the progress and end point of the reclamation process;
    and recommended criteria for the suitable use of reclaimed oils. The use of oil
    in new apparatus under warranty is not covered in this guide.'
