abstract:
- language: en
  script: Latn
  content: Millions of IEEE Std 802.15.4 Smart Utility Networking (IEEE Std 802.15.4
    SUN) based devices are currently operating in Sub-1 GHz frequency bands to provide
    the low to moderate data rate capabilities. IEEE std 802.11 Sub 1 GHz (IEEE Std
    802.11 S1G) devices can operate in the same Sub-1 GHz frequency bands and provide
    higher data rate capabilities. This recommended practice enables IEEE Std 802.15.4
    SUN and IEEE Std 802.11 S1G to effectively operate in license exempt Sub-1 GHz
    frequency bands, by providing best practices and coexistence methods.
