abstract:
- language: en
  script: Latn
  content: This standard specifies the technical and application requirements for
    large-scale AI models in rail transit, covering reference architecture, model
    building process,general competency, scenario service capability, and service
    requirements including data security, stability, robustness, operational performance,
    and openness. It provides unified guidance for rail transit enterprises, power
    generation and dispatching institutions to develop, apply, and evaluate large-scale
    AI model-based services, supporting the intelligent upgrading of survey and design,
    construction management operation and maintenance, and general scenarios in the
    rail transit industry.
