abstract:
- language: en
  script: Latn
  content: 'This standard covers metal-enclosed interrupter (MEI) switchgear assemblies
    containing, but not limited to, such devices as interrupter switches; selector
    switches; power fuses; control, instrumentation and metering devices; and protective
    equipment. It includes, but is not specifically limited to, equipment for the
    control and protection of apparatus used for distribution of electrical power.
    Interpretations for this standard are available at: http://standards.ieee.org/reading/ieee/interp/C37.20Series.html'
