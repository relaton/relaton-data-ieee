abstract:
- language: en
  script: Latn
  content: This guide provides information for designers, specifiers, installers,
    and operators to address and apply components and accessories for continuously
    monitoring temperatures of equipment and wiring connections for electrical switchgear
    and motor control centers (MCC). The concepts within this guide may be applicable
    to other electrical equipment not specifically covered by this guide.
