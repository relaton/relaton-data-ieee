abstract:
- language: en
  script: Latn
  content: The paper focuses on a decentralization model of connectivity that helps
    preserve cultural ethics and enables communities to co-create the internet. Internet
    Society (ISOC) defines Community Networks (CNs) as such local telecommunication
    infrastructures that are built, managed, and operated by local communities serving
    the rural and unconnected population who cannot afford traditional connectivity
    services or solutions. Using a multi-stakeholder approach, these networks leverage
    a variety of open-source tools and unlicensed spectrum to provide affordable connectivity
    and other support services for improving the lives of rural and unconnected communities
    socially and economically. Partnering with local entities and adopting a decentralized
    network approach for sustainability makes it unique compared to traditional ISPs.
