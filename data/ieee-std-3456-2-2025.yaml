abstract:
- language: en
  script: Latn
  content: High-strain testing instruments for deep foundations are testing devices
    that are used to evaluate the load-bearing capacity and integrity of foundation
    piles. Unlike low-strain testing, a large impact force is applied to the pile
    head to generate stress waves, thereby simulating actual pile loading conditions.
    The terms, symbols, basic requirements, and technical specifications for high-strain
    testing instruments are specified by this standard. Necessary requirements such
    as hardware requirements; software requirements; shock amplitude linearity error,
    impact zero drift, center frequency and bandwidth of the acceleration measurement
    system; its static performance and dynamic performance; dynamic range; channel
    conformity error; environmental robustness; and electromagnetic compatibility
    are also included. Testing methods, inspection rules, and marking requirements
    for high-strain testing instruments are also provided by this standard.
