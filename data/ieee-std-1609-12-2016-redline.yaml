abstract:
- language: en
  script: Latn
  content: Wireless Access in Vehicular Environments (WAVE) is specified in the IEEE
    1609 family of standards, within which a number of identifiers are used. The use
    of these identifiers is described, identifier values that have been allocated
    for use by WAVE systems are indicated, and the allocation of values of identifiers
    specified in the WAVE standards is specified.
