abstract:
- language: en
  script: Latn
  content: This standard specifies technical requirements for artificial intelligence
    (AI)-based data sample labeling and management for image data of transmission
    and distribution lines. It establishes a framework covering annotation objectives,
    annotation requirements, annotation methods, and sample management for equipment
    defects and external hidden dangers identified in inspection images. The standard
    defines requirements for images to be annotated, annotators, and annotation tools.
    By improving the consistency, accuracy, traceability, and security of labeled
    samples, this standard supports AI applications for monitoring, maintenance, fault
    diagnosis, and risk prevention in transmission and distribution line operations.
