abstract:
- language: en
  script: Latn
  content: Specification and test procedures for a single-axis Coriolis vibratory
    gyro (CVG) for use as a sensor in attitude control systems, angular displacement
    measuring systems, and angular rate measuring systems are defined. The test procedures
    are derived from those presently used in the industry. Informative annexes contain
    CVG design features and theoretical principles of operation.
