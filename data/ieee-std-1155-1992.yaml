abstract:
- language: en
  script: Latn
  content: 'A technically sound modular instrument standard base on IEEE Std 1014-1987,
    IEEE Standard for a Versatile Backplane Bus: VMEbus, which is open to all manufacturers
    and is compatible with present industry standards, is defined. The VXIbus specification
    details the technical requirements of VXIbus compatible components, such as mainframes,
    backplanes, power supplies, and modules.'
