abstract:
- language: en
  script: Latn
  content: This recommended practice covers the sizing of lithium batteries used for
    standby operation in stationary applications. This includes batteries that connect
    to loads via a dc-dc converter. Design of the dc system and sizing for renewable
    or grid energy storage systems are beyond the scope of this document. Sizing for
    engine-starting applications such as emergency generators and fire pumps is beyond
    the scope of this document.
