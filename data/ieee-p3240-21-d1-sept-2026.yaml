abstract:
- language: en
  script: Latn
  content: This standard specifies the framework and requirements for blockchain-based
    trusted access and data storage of generation-side distributed resources in virtual
    power plants. It clarifies the processes for the registration and connection of
    distributed generation units, the management of identity information, and the
    recording and verification of operational data.
