abstract:
- language: en
  script: Latn
  content: The transmission and distribution electric grid supply chain is expected
    to be improved through the implementation of a “digital thread” system in which
    asset attribute data is exchanged with supply chain partners in a digital format
    based on industry standards. This goal is achieved in the Supply Chain and Asset
    Traceability for the Electric Grid (SCATE) system defined in this standard through
    the use of industry-standard Unique IDs and Smart Tags (barcodes, RFID).
