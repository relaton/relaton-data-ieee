abstract:
- language: en
  script: Latn
  content: This standard specifies procedures and managed objects for quality of service
    (QoS) features specified in IEEE Std 802.1Q, such as Per-Stream Filtering and
    Policing, queuing, transmission selection, stream control, and frame preemption,
    in a network system that is not a Bridge.
