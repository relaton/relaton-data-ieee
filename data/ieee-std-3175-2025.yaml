abstract:
- language: en
  script: Latn
  content: The stray current corrosion issues associated with dc rail transit systems
    are well documented. However, the need for a concise guide document that can be
    used by transit agencies as a framework for the initial design of systems and
    for the ongoing maintenance of those systems has been identified. Assistance is
    provided by this guide to transit agencies in the establishment of key processes,
    as well as design and maintenance requirements, for the mitigation of stray current
    effects on new and existing dc rail transit systems. A knowledge base is provided
    by the guide for transit engineering personnel so that stray current problems
    may be reduced and appropriate proactive measures may be taken.
