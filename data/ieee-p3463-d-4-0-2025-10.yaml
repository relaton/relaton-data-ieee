abstract:
- language: en
  script: Latn
  content: This standard specifies the use of automobile chassis system signal cable
    characteristics, product classification, technical requirements, test methods,
    inspection regulations sign, packaging, transportation and storage. This standard
    applies to automobile chassis system connecting the brake pedal module, wheel
    brake module and the central electronic control unit between the transmission
    of energy and signals and signal of the special cable (hereinafter referred to
    as cable), this standard applies to single-core cable, also applies to multi-core
    cable in a single core.
