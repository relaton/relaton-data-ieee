abstract:
- language: en
  script: Latn
  content: This Standard defines environmental performance standards for personal
    computer products, including desktop computers, notebook computers, and computer
    monitors, that are marketed to institutions, and includes key concepts and implementation
    procedures relating to reduction or elimination of environmentally sensitive materials,
    materials selection, design for end of life, life cycle extension, energy conservation,
    end of life management, corporate performance and packaging.
