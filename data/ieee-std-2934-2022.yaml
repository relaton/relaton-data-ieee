abstract:
- language: en
  script: Latn
  content: Logistics operation processes in a smart factory, including the process
    composition such as warehousing, packaging, shipment or transportation; implementation
    conditions; process quality evaluation; and process improvement are defined in
    this standard. Methods for management organization, facility layout, equipment
    requirements, information systems, employee requirements, emergency management
    and evaluation in a smart factory are also defined in this standard.
