abstract:
- language: en
  script: Latn
  content: Specifications for representing three-dimensional (3D) maps for robotics
    and automation are provided in this standard. A recommended format for exchanging
    map data among robots, computers, and other devices is defined in this standard.
    The representation format specified by this standard considers static maps and
    describes their elements and associated uncertainty independently of the geographic
    scale and sensor modalities used to build the maps. In particular, this standard
    (a) defines a hierarchy of terminologies related to 3D robot maps for robotics
    and automation; (b) specifies a data model for each element of the hierarchy;
    and (c) specifies a JSON format for map data exchange between different robots,
    computer systems, and devices. This standard provides formats for exchanging 3D
    map data between robots and devices (e.g., by transmitting them over a communication
    channel or by saving them on some storing devices). This standard is not intended
    to affect internal formats that robots and devices use to build, update, and use
    maps.
