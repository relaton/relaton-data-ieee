abstract:
- language: en
  script: Latn
  content: Guidance for the planning, permitting, design, equipment specification,
    installation, commissioning, operation, and maintenance of gas-insulated transmission
    lines is provided in this project. Only technical aspects are addressed in this
    guide. Commercial and legal issues associated with gas-insulated transmission
    lines are not considered. This guide applies to ac transmission lines rated for
    maximum operating voltage of 72.5 kV and higher.
