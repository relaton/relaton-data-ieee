abstract:
- language: en
  script: Latn
  content: A number of international, national and industry standards describe processes
    and process reference models. For users of standards to select the appropriate
    forms of process description and apply them in a consistent fashion, it is desirable
    to specify them. This document provides specifications for processes and process
    views. This document also explains how conformance related to processes and process
    views can be defined, when processes and process views are described in accordance
    with this document. The requirements of this document can be applied to any process
    or process view developed for any purpose. This document is intended for use by
    all parties that define processes and process views, for example systems and software
    engineers, sector or special interest groups, professional standards groups, researchers,
    and process assessors.
