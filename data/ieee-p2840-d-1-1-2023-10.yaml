abstract:
- language: en
  script: Latn
  content: The contents within IEEE Std 2840™ pertains to licenses which, by conforming
    to this standard, meaningfully engages with the spirit of responsible use of AI
    systems. In this regard, the standard is not intended to define what a license
    or contract is as these are well understood by legal systems across the world.
    Rather, licenses conforming to the IEEE Std 2840 standard shall adhere to and
    specify clauses that pertain to dimensions of use (i.e., capabilities, consequences,
    and areas of application) of specific technical artifacts.
