abstract:
- language: en
  script: Latn
  content: 'Criteria for design analysis for qualification, quality, and reliability
    of rechargeable lithium ion batteries for host devices such as cellular telephone
    applications are established. Also included are: battery pack electrical and mechanical
    construction, packaging technologies, pack- and celllevel charge and discharge
    controls, and overall system considerations.'
