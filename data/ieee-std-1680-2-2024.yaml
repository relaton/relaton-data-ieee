abstract:
- language: en
  script: Latn
  content: A clear and consistent set of environmental performance criteria for the
    design of imaging equipment products is established, providing an opportunity
    to secure market recognition for efforts to reduce the environmental impact of
    electronic products. This standard is also intended to provide a tool for government,
    institutional, corporate, and consumer purchasers to identify products that demonstrate
    environmental leadership. The intent is that the standard will be updated and
    revised periodically to continue to set a higher performance standard for leadership
    products. (The PDF of this standard is available at no charge compliments of the
    sponsorship by Green Electronics Council.https://ieeexplore.ieee.org/browse/standards/get-program/page/series?id=86)
