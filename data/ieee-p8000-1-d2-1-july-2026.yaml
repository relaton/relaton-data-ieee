abstract:
- language: en
  script: Latn
  content: 'A method to assess the trustworthiness of Al systems is defined by the
    standard. Seven distinct scores - one for each of the following principles - reflecting
    the trustworthiness and ethical soundness of an Al system can be assigned using
    the method, namely: − Accountability − Human Agency &amp; Oversight − Technical
    Robustness &amp; Safety − Privacy &amp; Data Governance − Transparency − Diversity,
    Non-Discrimination &amp; Fairness − Societal &amp; Environmental Well-Being The
    method is applicable to both high-risk and non-high-risk Al systems. The method
    is designed to score Al systems at different stages of the supply chain, from
    development through deployment and operation. The method is intended to serve
    as the foundation of an Al system trust rating service and certification program.'
