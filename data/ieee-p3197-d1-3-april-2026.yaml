abstract:
- language: en
  script: Latn
  content: Adaptation language for the interface between communication unit and data
    equipment of smart meters is discussed in this guide. Interfaces to enable interoperability
    between a smart meter and a data transmission unit and to specify the functional
    characteristics and operating parameters of the data transmission unit are defined
    by this guide.
