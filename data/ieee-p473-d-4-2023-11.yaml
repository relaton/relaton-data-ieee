abstract:
- language: en
  script: Latn
  content: Information and guidance for characterizing radiated levels of electromagnetic
    (EM) noise or interference that may be present in various environments between
    10 kHz and 40 GHz are provided in this recommended practice. Methods that may
    be used to plan for and execute the characterization of the electromagnetic environment
    in a particular environment or location are provided. Characterizing the electromagnetic
    environment is traditionally referred to as a site survey. A site survey can be
    applicable to congested metropolitan environments, industrial settings, commercial
    buildings, open fields, remote geographical locations, and in and around ships,
    aircraft, and vehicles.
