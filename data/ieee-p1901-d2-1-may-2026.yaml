abstract:
- language: en
  script: Latn
  content: The Physical (PHY) and Media Access Control (MAC) layers for broadband
    communications are specified in this standard, supporting applications such as
    local area networks (LANs), Smart Energy, Smart Grid, Internet of Things (IoT),
    transportation platforms (vehicle), and other data distribution applications.
    A flexible channel wavelet (FCW) and extended FCW PHY/MAC technology is specified
    to enable adaptation to different frequency bands and to support communication
    over various transmission media, including but not limited to, power lines (ac
    or dc), coaxial cables, signal cables, optical fiber, light (visible, infrared),
    and radio waves. FCW and extended FCW communication channels in low-frequency
    bands are defined to extend communication range and improve robustness. Support
    for network synchronization and enhanced network functionality through the IEEE
    Std 1588™ Precision Time Protocol (PTP) is specified. State-of-the-art security
    mechanisms are integrated, including authentication and authorization capabilities
    suitable for IoT and access devices. The use of IEEE Std 802.1X™ within IEEE Std
    1901™ networks is specified to provide secure access control and to protect the
    privacy and integrity of communications, thereby enabling the use of the technology
    for security-sensitive services. Mechanisms for coexistence and interoperability
    between different Broadband over Power Lines (BPL) devices are specified, ensuring
    efficient use of the power line channel and the provision of required communication
    bandwidth and quality of service.
