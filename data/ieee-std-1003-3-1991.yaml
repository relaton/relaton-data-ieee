  script: Latn
  content: 'Withdrawn Standard. Withdrawn Date: Dec 09, 1997. No longer endorsed by
    the IEEE. This standard defines the general requirements and test methods for
    measuring conformance to POSIX standards. This standard is aimed primarily at
    working groups developing test methods for POSIX standards, developers of POSIX
    test methods, and users of POSIX test methods.'
