abstract:
- language: en
  script: Latn
  content: This standard establishes criteria for design analysis for quality, and
    establishes criteria for reliability of rechargeable Li-Ion and Li-Ion Polymer
    batteries for mobile telephone applications. Also included in the standard are
    battery pack electrical and mechanical construction, packaging technologies, pack
    and cell level charge and discharge controls, and overall system considerations..
