abstract:
- language: en
  script: Latn
  content: The standard provides recommended practices for ethical usage of emulated
    empathy in General-Purpose Artificial intelligence (GPAl) systems for human-artificial
    intelligence (Al) partnerships. The use of emulated empathy in GPAl systems for
    human-Al partnerships refers to general-purpose Al products marketed as empathic
    partners, personal Al, companions, co-pilots, agents, assistants, and related
    phrasing for human-Al partnering. IEEE 7014.1 is a domain-specific extension of
    IEEE 7014™ Standard for Ethical Considerations in Emulated Empathy in Autonomous
    and Intelligent Systems. Whereas IEEE 7014 provides overarching principles for
    ethical evaluation of emulated empathy across AI, IEEE 7014.1 focuses on the overlap
    of GPAI, emulated empathy and human-AI partnering.
