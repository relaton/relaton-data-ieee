abstract:
- language: en
  script: Latn
  content: This amendment specifies the set of 1 changes required to address technical
    and editorial errors that have been identified in the IEEE1801-2013 standard.
    In addition this amendment also specifies a few changes and enhancements to remove
    some ambiguities and inconsistencies related to the semantics of power states,
    power supplies, precedence rules, and location of power management cells
