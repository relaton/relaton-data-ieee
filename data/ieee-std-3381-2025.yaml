abstract:
- language: en
  script: Latn
  content: This guide is applicable to electric vehicle supply equipment (EVSE) with
    a rated supply voltage up to 1000 V alternating current (ac) or up to 1500 V direct
    current (dc) and a rated output voltage up to 1500 V dc. A method of condition
    evaluation of EVSE, including general principles, condition evaluation method,
    and classification, is specified.
