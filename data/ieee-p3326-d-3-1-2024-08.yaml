abstract:
- language: en
  script: Latn
  content: The application of online infrared inspection systems for substations is
    introduced in this recommended practice. The system composition, functional and
    performance requirements, test methods, and test rules are provided, as well as
    a comprehensive framework for realizing accurate and efficient infrared online
    inspection.
