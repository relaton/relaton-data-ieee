abstract:
- language: en
  script: Latn
  content: Specific test requirements for qualifying electrical resistance trace heating
    for commercial service are provided in this standard. A basis for electrical and
    thermal design is included, heating device characteristics are addressed, and
    installation and maintenance requirements are detailed. Recommendations and requirements
    for unclassified heating device applications are provided.
