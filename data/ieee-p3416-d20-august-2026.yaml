abstract:
- language: en
  script: Latn
  content: Guidelines for the application, characteristics, and calibration of relay
    test sets are provided by this guide. Lifecycle testing phases, protection function/scheme
    test methods, and hybrid analog digital/virtual testing are included in the relay
    test set application. Common analog and digital characteristics of relay test
    sets are specified next. Finally, testing/calibration procedures are outlined.
    The guide serves as a key reference for design, operation, and maintenance of
    relay test sets.
