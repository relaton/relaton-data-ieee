abstract:
- language: en
  script: Latn
  content: This standard specifies the technical requirements for a blockchain-based
    carbon footprint management framework in coal-fired power generation. It includes
    the processes of data collection, verification, calculation, on-chain storage,
    and data sharing across the full lifecycle of carbon emissions in coal-fired electricity
    generation.
