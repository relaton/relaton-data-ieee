abstract:
- language: en
  script: Latn
  content: A comprehensive framework for the voltage-endurance testing of form-wound
    bars and coils used in large rotating machine stator windings is provided in this
    recommended practice. The procedures for conducting voltage endurance tests on
    bars/coils with nominal voltage up to 30 000 V, and operating frequencies of 50
    Hz or 60 Hz, are outlined. Power supply and voltage requirements, test set-up,
    specimen preparation, pre-test evaluation methods, as well as temperature and
    voltage application and measurement methods are specified. Guidelines for failure
    investigations, suggested test records, and test report requirements are provided.
