abstract:
- language: en
  script: Latn
  content: This standard defines a wireless interface communication protocol and the
    Transducer Electronic Data Sheets (TEDS) for smart sensors deployed for tidal/wind
    turbine health monitoring applications. It specifies radio-specific protocols
    for this wireless interface. It defines communication modules that connect the
    wireless transducer interface module (WTIM) and the network-capable applications
    processor (NCAP) using the radio-specific protocols in the framework of IEEE 1451
    standard family and in compliance with IEEE 1451.0. The standard shall be utilized
    as an extension to legacy wired sensors deployed in SCADA and CMS systems for
    smart tidal/wind turbine and its subsystem health monitoring and diagnosis. The
    standard can also be utilized for other zero-carbon power generation systems,
    such as wave energy conversion systems. This standard aims to enhance tidal/wind
    turbine data acquisition through standardized wireless communication and transducer
    data formats, ensuring improved reliability, interoperability, and efficiency.
