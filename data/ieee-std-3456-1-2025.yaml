abstract:
- language: en
  script: Latn
  content: The integrity and continuity of concrete piles after installation are evaluated
    using low-strain testing instruments for deep foundations, which are non-destructive
    testing devices. They are among the most commonly used tools in pile quality assessment.
    The terms, symbols, basic requirements, and technical specifications for low-strain
    testing instruments are specified by this standard. Necessary requirements such
    as hardware requirements, software requirements, vibration amplitude linearity,
    the center frequency and bandwidth of the acceleration measurement system, dynamic
    range, environmental robustness, and electromagnetic compatibility should also
    be included. Testing methods, inspection procedures, and marking for low-strain
    testing instruments are also provided by this standard.
