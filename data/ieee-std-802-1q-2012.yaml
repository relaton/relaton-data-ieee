abstract:
- language: en
  script: Latn
  content: 'This standard specifies how the MAC Service is supported by Virtual Bridged
    Local Area Networks, the principles of operation of those networks, and the operation
    of VLAN-aware Bridges, including management, protocols, and algorithms. It Incorporates:
    IEEE Std 802.1Q&#8482;-2011, IEEE Std 802.1Qbe&#8482;-2011, IEEE Std 802.1Qbc&#8482;-2011,IEEE
    Std 802.1Qbb&#8482;-2011, IEEE Std 802.1Qaz&#8482;-2011, IEEE Std 802.1Qbf&#8482;-2011,IEEE
    Std 802.1Qbg&#8482;-2012, IEEE Std 802.1aq&#8482;-2012, and IEEE Std 802.1Q&#8482;-2011/Cor
    2-2012)'
