  script: Latn
  content: This guide provides mathematical models for designers and facility operators
    to apply in determining the arc-flash hazard distance and the incident energy
    to which workers could be exposed during their work on or near electrical equipment.
    An errata is available at https://standards.ieee.org/wp-content/uploads/import/documents/erratas/1584-2018_errata.pdf.
