abstract:
- language: en
  script: Latn
  content: Superseded by 1074-1997. The set of Activities that constitute the Processes
    that are mandatory for the development and maintenance of software, whether stand-
    alone or part of a system, is provided. Non-software Activities, such as hardware
    development and purchasing, are outside of the scope of this standard. Also provided
    is associated Input and Output Information.
