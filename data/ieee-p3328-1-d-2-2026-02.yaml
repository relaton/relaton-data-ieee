abstract:
- language: en
  script: Latn
  content: This recommended practice describes a wheeled robot designed for substation
    inspection and live detection operations. It specifies the system architecture,
    application scenarios, functional and performance requirements, inspection and
    detection procedures, calibration and acceptance standards, as well as maintenance
    and servicing requirements. This method is applicable to wheeled robots used in
    inspection and live detection operations in both AC and DC substations.
