abstract:
- language: en
  script: Latn
  content: U.S. consensus guideline for automation of conducted and radiated EMI compliance
    measurements is provided in this guide. This document does not include mandatory
    specifications for automation tools (i.e., application software, automated test
    equipment, computers and peripherals). Where possible, the guidance provided herein
    is harmonized with other national and international standards used for similar
    purposes.
