abstract:
- language: en
  script: Latn
  content: The set of changes required to address technical and editorial errors that
    have been identified in IEEE Std 1801-2013 are specified in this amendment. In
    addition this amendment also specifies a few changes and enhancements to remove
    some ambiguities and inconsistencies related to the semantics of power states,
    power supplies, precedence rules, and location of power management cells.
