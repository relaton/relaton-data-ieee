abstract:
- language: en
  script: Latn
  content: This standard can be applied to internet-based business scenarios, and
    can also be served serve as a practical guide to achieve help assess business
    security risk control through the big data technology. This standard can be applied
    in other types of organization, including public or privately-owned or state-owned
    enterprises, associations, or organizations, or by individuals, to improve assessment
    of their protection capability against business security risks based on big data
    technology.
