abstract:
- language: en
  script: Latn
  content: This standard provides an architectural blueprint for the development of
    the Power Distribution IoT (PDIoT) engaging various domains and stakeholders.
    This standard also leverages an architectural framework for the IoT defined in
    the draft of IEEE P2413 standard. This standard defines a Reference Architecture
    for Power Distribution that includes the cloud layer, pipe layer, edge layer and
    device layer. It also includes the descriptions of various IoT use cases and applications
    in Power Distribution.
