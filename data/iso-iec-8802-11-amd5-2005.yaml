abstract:
- language: en
  script: Latn
  content: Adoption IEEE Std 802.11h-2003. This amendment specifies the extensions
    to IEEE 8802.11(TM) for wireless local area networks (WLANs) providing mechanisms
    for dynamic frequency selection (DFS) and transmit power control (TPC) that may
    be used to satisfy regulatory requirements for operation in the 5 GHz band in
