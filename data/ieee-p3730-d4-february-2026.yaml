abstract:
- language: en
  script: Latn
  content: The functional requirements for trusted data spaces (TDSs) that enable
    governed data exchange across organizational boundaries while preserving participant
    autonomy are specified in this standard. It defines a center-edge architecture
    consisting of a TDS service platform for global governance functions and distributed
    TDS connectors for participant-side integration and control. The requirements
    cover data publishing, cross-domain interoperability, operational governance,
    and data stewardship, providing a functional baseline to support interoperable
    and automatable TDS implementations.
