abstract:
- language: en
  script: Latn
  content: This guide provides guidelines and performance expectations forthe application
    of power electronic-based equipment on distribution systems of power providers
    to improve power quality. It is a resource to electric utility providers as they
    enter into the competitive marketplace. It provides detailed information about
    custom power devices as options to solve power quality problems.
