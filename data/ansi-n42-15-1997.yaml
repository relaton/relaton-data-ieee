abstract:
- language: en
  script: Latn
  content: Tests and procedures to ensure that a liquid-scintillation counting system
    is producing reliable data are provided for designers and users. This standard
    does not cover the calculation of sample activity for quenched unknown samples,
    sample preparation, efficiency correlation (quench correction) procedures, or
    identification of unknown radionuclides.
