abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.1Q-2022 as amended by IEEE Std 802.1Qcz-2023
    and IEEE Std 802.1Qcw-2023 specifies protocols, procedures, and management objects
    for auto attachment of network devices to Provider Backbone service instances
    using Type, Length, Value (TLVs) within the Link Layer Discovery Protocol (LLDP).
    (PDF of this Standard is available at no charge, compliments of the IEEE GET program
    at https://ieeexplore.ieee.org/browse/standards/get-program/page/series?id=68).
