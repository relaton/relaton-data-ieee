abstract:
- language: en
  script: Latn
  content: This standard defines the specification for automotive electronics product
    inspection equipment, focusing on its structure, detection precision, functions
    of visual detection, functions of signal detection, functions of the software,
    data transfers, data storage, and the technique for detecting whether the equipment
    meets requirements.
