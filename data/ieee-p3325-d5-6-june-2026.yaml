abstract:
- language: en
  script: Latn
  content: The information on configurations, working conditions, typical performance,
    test methods, and data analysis to evaluate and determine the performance characteristics
    of an ultraviolet (UV) radiation detector is given in this document. UV radiation
    detector hardware components, performance characteristics, data collection, and
    data analysis methods are also described. This guide provides suggestions for
    several practices, technical information, and data analysis for UV radiation detection.
    This document only includes ultraviolet radiation detectors with a wavelength
    of 100nm to 280nm (UV-C).
