abstract:
- language: en
  script: Latn
  content: Generally accepted methods of protection for ac motors are provided. The
    functions necessary for adequate protection of motors based on type, size, and
    application are identified and summarized. The protective requirements of all
    motors in every situation is not purported to be detailed in this guide.
