abstract:
- language: en
  script: Latn
  content: This standard provides a framework for formulating and evaluating how well
    the behavior of automated driving agents aligns with human intentions. This framework
    specifies evaluation setups and related data, methods, and metrics. The standard
    defines a minimum set of scenarios in which human intentions are encoded through
    agent behaviors.
