abstract:
- language: en
  script: Latn
  content: This standard is applicable to celebratory balloons 1 that are comparable
    in size and shape to what are commonly referred to as foil balloons available
    in retail stores and filled with helium or a lighter-than-air gas mixture. The
    test procedures outlined in this standard are intended to evaluate the expected
    dielectric performance of celebratory balloons when in contact with simulated
    energized overhead distribution power lines. The intent is to reduce balloon-caused
    power system outages or electrical faults in active overhead power lines. The
    scope is limited to distribution system voltages of 38 kV or less and only single
    balloons. The effects of having any moisture, contaminants, or string or ribbon
    attachments to the balloon(s) are not investigated under this procedure.
