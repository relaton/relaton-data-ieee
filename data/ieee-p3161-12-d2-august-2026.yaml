abstract:
- language: en
  script: Latn
  content: The aspects of application framework, deployment architecture under different
    system forms, applicable scenarios and general deployment solutions, as well as
    recommended solutions for typical industry applications of the digital retina
    system (DRS) are specified in this guide. This guide provides functional requirements
    and deployment recommendations for the end-edge-cloud, end-edge, and end-cloud
    forms, as well as recommended solutions for typical industry applications, such
    as smart transportation, smart park, urban management, and video networking, to
    support efficient implementation and large-scale deployment of the DRS in diverse
    application scenarios and provide implementable technical references and best
    practices for industry users.
