abstract:
- language: en
  script: Latn
  content: The main assets and threats targeting operating systems used in connected
    vehicles are identified. The security requirements of the operating systems to
    support the core security functions in connected vehicles are defined. A set of
    test methods is established to evaluate the security of operating systems in connected
    vehicles.
