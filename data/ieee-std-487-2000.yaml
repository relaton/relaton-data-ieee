abstract:
- language: en
  script: Latn
  content: 'Workable methods for protecting wire-line communication circuits entering
    electric supply locations are presented. This document covers: the electric supply
    location environment; protection apparatus; services types, reliability, service
    performance objective classifications, and transmis-sion considerations; protection
    theory and philosophy; protection configurations; installation and inspection;
    and safety. Remarks: Revised by IEEE Std 287-2007'
