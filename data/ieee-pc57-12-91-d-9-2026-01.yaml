abstract:
- language: en
  script: Latn
  content: To reflect current practice in the testing procedures of dry-type transformers,
    substantive changes to Clause 5, Clause 8, Clause 9, Clause 10, Clause 11, and
    Clause 12 of IEEE Std C57.12.91-2020 have been made in this revision. This revision
    does not address transformer requirements and specific test criteria; rather they
    are contained in appropriate standards such as IEEE Std C57.12.01 or in user specifications.
