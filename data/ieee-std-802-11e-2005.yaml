abstract:
- language: en
  script: Latn
  content: This amendment defines the medium access control (MAC) procedures to support
    local area network (LAN) applications with quality of service (QoS) requirements.
    The procedures include the transport of voice, audio, and video over IEEE 802.11
    wireless LANs (WLANs).
