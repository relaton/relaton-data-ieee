abstract:
- language: en
  script: Latn
  content: The application guide of knowledge graphs for financial services is defined
    in this standard, the knowledge model of knowledge graphs for financial services
    is proposed, the general framework of technical activities of knowledge graphs
    for financial services is given, the process and application methods of constructing
    knowledge graphs for financial services is described, and the practical application
    factors for use cases of knowledge graphs for financial services is expounded.
