abstract:
- language: en
  script: Latn
  content: This amendment specifies protocols, procedures, and managed objects to
    support connectivity fault management. These allow discovery and verification
    of the path, through bridges and LANs, taken for frames addressed to and from
    specified network users. Connectivity faults can be detected and isolated to an
    individual bridge or LAN.
