abstract:
- language: en
  script: Latn
  content: Information on the application of under frequency load shedding and restoration
    to ac power systems is compiled in this guide. Various system conditions that
    may require the use of under frequency load shedding, and the application of protective
    relays to various methods of performing under frequency load shedding are described
    in this guide. Some practical examples of under frequency load shedding applications
    are also provided
