  script: Latn
  content: 'Replaced by ISO/IEC 23026: 2006. Recommended practices for World Wide
    Web page engineering for Intranet and Extranet environments, based on World Wide
    Web Consortium (W3C(R) ) and related industry guidelines,are defined in this recommended
