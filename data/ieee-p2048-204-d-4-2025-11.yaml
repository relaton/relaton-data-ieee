abstract:
- language: en
  script: Latn
  content: This standard specifies security requirements that address the complete
    life cycle of circulating digital commodities in a blockchain-based metaverse.
    For digital commodities, the standard defines general requirements, basic security
    requirements, and circulation security requirements. The standard provides strong
    support for the protection of intellectual property. Through use of blockchain
    technology, the standard helps to record and track the entire process of creation,
    authorization, and transaction of digital commodities, thereby providing a reliable
    basis for consumers to safeguard their rights.
