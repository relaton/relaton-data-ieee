abstract:
- language: en
  script: Latn
  content: This standard defines a data framework for planning and control modules
    during Software-in-the-Loop simulation testing. It includes the types of test
    scenarios being input, the data representation forms of the scenarios, general
    methods for generating test scenarios, as well as the data content and format
    of the test outputs, and the corresponding evaluation metrics.
