abstract:
- language: en
  script: Latn
  content: 'Performance evaluation metrics, including definitions, descriptions, and
    classification requirements, evaluation rating criteria, and test environments
    for smart TV system software, along with each testing step, is specified in this
    standard. Based on product usage scenarios, the performance testing metrics for
    smart TV system software are divided into five main categories: basic performance,
    video playback performance, control performance, screen mirroring performance,
    as well as performance stability and anti-aging performance. A tiered evaluation
    system, classifying performance fluency metrics into three levels based on performance
    data, with explanations of the user experience for each level is defined in this
    standard.'
