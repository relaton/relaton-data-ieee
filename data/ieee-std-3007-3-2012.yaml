abstract:
- language: en
  script: Latn
  content: All aspects of electrical safety in industrial and commercial power systems
    are covered. This recommended practice provides personnel with guidelines for
    understanding the fundamental concepts of the hazards of electricity along with
    safety-related activities associated with the operation and maintenance of in-plant
    electrical power distribution systems.
