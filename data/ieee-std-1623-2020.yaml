abstract:
- language: en
  script: Latn
  content: 'General guidelines on the preparation of a functional specification for
    a solid-state electronic shunt device used to compensate voltage fluctuation are
    provided in this guide. Devices rated medium voltage (1 kV to 35 kV) are covered
    in this guide. In general, these devices contain: an inverter, a rectifier or
    dc converter, an energy storage device, and a coupling transformer. The device
    is typically connected in parallel with the network using a coupling transformer.'
