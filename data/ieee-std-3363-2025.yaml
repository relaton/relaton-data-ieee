abstract:
- language: en
  script: Latn
  content: Data unit format for use by Internet of Things (IoT) power sensors is specified
    in this standard. The exchange of service data, control data, and fragmented data
    via the IEC 61850/IEC 60870-104 or Message Queuing Telemetry Transport (MQTT)
    protocol is described by the data format.
