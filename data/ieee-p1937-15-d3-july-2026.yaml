abstract:
- language: en
  script: Latn
  content: This standard specifies the basic technical and operational requirements
    for secure and reliable communication between performing drones and ground control
    stations in Drone Formation Flying Shows (DFFS). It focuses on command, control,
    and synchronization links and associated security measures. GPS/GNSS positioning
    techniques (such as the detailed choreography and RTK-based positioning of drones)
    are outside the scope of this document. Other aspects of drone show safety (e.g.
    mechanical safety, choreography design) are also outside this scope, which is
    limited to communication security and related system resilience.
