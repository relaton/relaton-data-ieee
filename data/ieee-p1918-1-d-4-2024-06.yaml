abstract:
- language: en
  script: Latn
  content: A framework for the Tactile Internet, including descriptions of various
    application scenarios, definitions and terminology, functions, and technical assumptions,
    is defined by this standard. Also included prominently in this framework is a
    reference architecture, which defines common architectural entities, interfaces
    between those entities, and the mapping of functions to those entities. Mission
    critical applications (e.g., manufacturing, transportation, healthcare, and mobility)
    and noncritical applications (e.g., edutainment and events) are encompassed by
    the Tactile Internet.
