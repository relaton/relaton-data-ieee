abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.3-2008 includes changes to IEEE Std 802.3-2008
    and adds Clause 80 through Clause 88, Annex 83A through Annex 83C, Annex 85A,
    and Annex 86A. This amendment includes IEEE 802.3 Media Access Control (MAC) parameters,
    Physical Layer specifications, and management parameters for the transfer of IEEE
    802.3 format frames at 40 Gb/s and 100 Gb/s.
