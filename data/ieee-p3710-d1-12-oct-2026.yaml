abstract:
- language: en
  script: Latn
  content: 'This guide provides comprehensive engineering guidance for the design
    and deployment of Modular Data Centers (MDCs) in North America, with emphasis
    on conformity to applicable electrical installation codes and product safety standards.
    It addresses three primary modular configurations: power-distribution-only systems,
    Information Technology (IT) installation–infrastructure-only systems, and integrated
    power/IT solutions. While the scope does not include IT equipment performance
    or functional specifications, it focuses on the electrical design considerations
    necessary to ensure safe, reliable, and code-compliant installation of supporting
    infrastructure. The document establishes a consistent framework for evaluating
    and implementing electrical architectures that enhance the safety, reliability,
    and operational efficiency of modular system deployments. Key topics include power
    distribution methods, grounding and bonding, codes and standards and integration
    facility power systems. The guide supports the design of MDCs intended for both
    integration into existing buildings and deployment as new, stand-alone installations.
    By standardizing design expectations, this guide aims to reduce variability in
    MDC electrical installations, streamline engineering processes, and improve interoperability
    across diverse deployment scenarios. It provides designers, engineers, and facility
    operators with practical considerations to ensure that MDC infrastructure can
    be deployed rapidly while meeting all relevant North American safety and performance
    requirements.'
