abstract:
- language: en
  script: Latn
  content: This standard specifies how the Media Access Control (MAC) Service is supported
    by Bridged Networks, the principles of operation of those networks, and the operation
    of MAC Bridges and VLAN Bridges, including management, protocols, and algorithms.
    Supersedes 802.1Q-2014. IEEE 802.1Qcd-2015, IEEE 802.1Qca-2015,IEEE 802.1Q-2014_Cor-1-2015,
    IEEE 802.1Qbv-2015, IEEE 802.1Qbu-2016, IEEE 802-1Qbz-2016, IEEE 802.1Qci-2017
    and IEEE 802.1Qch-2017.
