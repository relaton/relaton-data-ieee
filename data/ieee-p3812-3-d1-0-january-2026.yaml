abstract:
- language: en
  script: Latn
  content: The standard describes the establishment and implementation of a decentralized
    identity framework that utilizes distributed ledger technology (DLT) as its underlying
    trust anchor. Its goal is to promote open interoperability across various systems,
    providing reliable entity identification and universal access management. The
    framework, combined with blockchain technology and network protocols, enables
    trustless, open operations previously limited to closed systems, and multi-system
    interoperability rooted in autonomous identity. Together, these elements create
    a trustless environment that enables entities to independently verify identities
    and credentials without the need for centralized oversight. The goal of the framework
    is to unify identity transaction interfaces, thereby facilitating smooth interactions
    with external components and third-party services.
