abstract:
- language: en
  script: Latn
  content: The detection of partial discharges occurring in the insulation of dry-type
    transformers or their components and the measurement of the associated apparent
    charge at the terminals when the alternating test voltage is applied are covered.
    The wideband method is used. The detection system and calibrator characteristics
    are described, and the test procedures are established.
