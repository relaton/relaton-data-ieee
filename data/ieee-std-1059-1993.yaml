abstract:
- language: en
  script: Latn
  content: Guidance in preparing Software Verification and Validation Plans (SVVPs)
    that comply with IEEE Std 1012-1986 are provided. IEEE Std 1012-1986 specifies
    the required content for an SVVP. This guide recommends approaches to Verification
    and Validation (V &amp; V) planning. This guide does not present requirements
    beyond those stated in IEEE Std 1012-1986.
