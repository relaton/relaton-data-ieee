abstract:
- language: en
  script: Latn
  content: A standard profile for communications with distributed energy resources
    (DERs) using IEEE Std 1815™ [Distributed Network Protocol (DNP3)] is established.
    A high-level data model for DER communications, based on selected data objects
    from International Electrotechnical Commission (IEC) 61850-7-420:2021 mapped to
    a fixed list of DNP3 data points, comprises the profile. The data objects needed
    for many DER and inverter-base resources (IBRs) functions, including those in
    IEEE Std 1547™-2018, IEEE Std 2800™-2022, and IEEE Std 1547.9™-2022, as well as
    additional functions needed for storage systems, are also specified. In addition,
    a mapping to detailed equipment-related data objects, including meters, DER units,
    inverters, and batteries, is provided. The profile is presented in both a written
    and an electronic format (IEEE 1815.2 Profile Companion Data Point Tables) for
    ease of implementation.
