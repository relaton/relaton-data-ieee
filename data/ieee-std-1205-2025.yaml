abstract:
- language: en
  script: Latn
  content: Guidelines for assessing, monitoring, and mitigating aging degradation
    effects on electrical equipment used in nuclear facilities are provided in this
    guide. Also included are informative annexes on aging mechanisms, environmental
    monitoring, condition monitoring, aging program essential attributes, and examples
    demonstrating the application of the basic principles described in this guideline.
