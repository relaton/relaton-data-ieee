abstract:
- language: en
  script: Latn
  content: ANSI N42.17C-1989 American National Standard Performance Specifications
    for Health Physics InstrumentationPortable Instrumentation for Use in Extreme
    Environmental Conditions, describes the minimum acceptable performance criteria
    for health physics instrumentation for use under extreme environmental conditions
    for monitoring ionizing radiation fields. This standard supplements the basic
    performance specifications for portable health physics instrumentation presented
    in ANSI N42.17A-1989.
