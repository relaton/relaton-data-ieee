abstract:
- language: en
  script: Latn
  content: Recommended engineering principles, practices, and guidelines for the selection
    and application of emergency and standby power systems are presented. Industrial
    and commercial users' needs are outlined and discussed, and the material is primarily
    presented from a user's viewpoint. General requirements, protection, grounding,
    applications by specific industry, and maintenance guidelines are included.
