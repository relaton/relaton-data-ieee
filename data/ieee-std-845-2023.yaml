  script: Latn
  content: Guidance for evaluating human-system performance related to systems, equipment,
    and facilities in nuclear power generating stations is provided. Specific evaluation
    techniques and rationale for their application within the integrated systems approach
    to plant design, operations, and maintenance described in IEEE Std 1023&#8482;
