abstract:
- language: en
  script: Latn
  content: The renewable energy certificates are recognized proofs of renewable energy
    consumption, which can reflect its the environmental value and help enterprises
    to cope with carbon emission reduction pressure. This standard specifies the basic
    principles, overall framework, and related requirements for renewable energy certificates
    trading based on blockchain. The purpose is to realize the trusted circulation
    and large-scale trading of renewable energy certificates on a global scale, further
    promote the development of global renewable energy and climate governance processes.
