abstract:
- language: en
  script: Latn
  content: This standard provides requirements to demonstrate the adequacy of new
    Class 1E transformers, located in a mild environment of a nuclear power generating
    station as defined in IEEE/IEC 60780-323, to perform their required safety functions
    under postulated service conditions. This standard applies to single- and three
    phase transformers rated 601 V to 15000 V for the highest voltage winding and
    up to 2500 kVA (base rating).
