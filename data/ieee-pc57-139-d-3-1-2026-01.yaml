abstract:
- language: en
  script: Latn
  content: General types of on-load tap-changer (OLTC) mechanisms, breathing configurations,
    and electrical designs, described for reference for determining methods of testing
    and evaluating dissolved gases in mineral-based transformer oils in OLTCs, are
    discussed and recommended in this guide. Measurements of dissolved gas concentrations
    in the OLTC oil are required to implement this guide. This guide is not manufacturer
    specific, rather category specific.
