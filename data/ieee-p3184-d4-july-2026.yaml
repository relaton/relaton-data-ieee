abstract:
- language: en
  script: Latn
  content: A data-related architecture for an autonomous driving system, including
    architectural components, interfaces, transmission protocols and connection protocols,
    to support interoperability and improve reliability is specified by this standard.
    Efficiency-related evaluation metrics for an autonomous driving system, including
    perception and decision accuracy, processing latency, and the energy consumption
    of sensors and computing units, are also defined. A common framework for the development,
    evaluation, and deployment of an autonomous driving system is also provided.
