abstract:
- language: en
  script: Latn
  content: 'This corrigendum corrects technical and otherre non-editorial errors made
    during the preparation of IEEE Std C37.04-1999 latest version, third printing
    29 November 2005, which covers the rating structure for high-voltage circuit breakers
    rated over 1000 VAC. This corrigendum includes the corrections made in the errata,
    as the errata will be removed once this corrigendum is approved. As of the printing
    of this corrigendum, IEEE Std. C37.04-1999 includes the following: -- IEEE Std
    C37.04&#8482;-1999 latest version, third printing 29 November 2005; -- IEEE Std
    C37.04a&#8482;-2003, Amendment 1: Capacitance Current Switching; -- IEEE Std C37.04b&#8482;,
    Amendment 2: Amendment to Change the Description of Transient Recovery Voltage
    for Harmonization with IEC 62271-100; and -- this corrigendum, IEEE Std C37.04-1999/Cor
    1-2009, which makes technical corrections to the original IEEE Std. C37.04-1999
    and includes the corrections published in an errata.'
