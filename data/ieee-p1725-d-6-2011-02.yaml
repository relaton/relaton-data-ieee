abstract:
- language: en
  script: Latn
  content: 'This standard establishes criteria for design analysis for qualification,
    quality, and reliability of rechargeable lithium ion and lithium ion polymer batteries
    for cellular telephone applications. Also included in the standard are: battery
    pack electrical and mechanical construction, packaging technologies, and pack
    and cell level charge and discharge controls and overall system considerations.'
