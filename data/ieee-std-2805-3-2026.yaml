abstract:
- language: en
  script: Latn
  content: The collaboration protocols for enabling machine learning on the edge computing
    node with support from industrial clouds are specified in this standard. Implementation
    references of machine learning upon lower-powered and cheaper embedded devices,
    a specific hardware-based method of accepting the introduced machine learning
    models, and then the online optimization comparing the models with incoming live
    data are provided.
