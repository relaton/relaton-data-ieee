abstract:
- language: en
  script: Latn
  content: Superseded by IEEE Std C62.11-2005 Metal-oxide surge arresters designed
    to repeatedly limit the voltage surges on 48¬62 Hzpower circuits (&#x003E;1 kV)
    are covered in this standard. These devices operate by discharging surgecurrent.
    Devices for separate mounting and those supplied integrally with other equipment
    are alsodiscussed.
