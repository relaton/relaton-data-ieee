abstract:
- language: en
  script: Latn
  content: Minimum performance specifications and testing 1 methods for the evaluation
    of personal radiation detectors, also known as PRDs, are contained in this standard.
    These PRDs are small instruments that are body-worn by the user. These instruments
    are primarily designed for a fast response when detecting radioactive materials
    emitting gamma rays. This document does not apply to the performance of radiation
    protection instrumentation which is covered in other standards such as ANSI/IEEE
    N42.20, ANSI/IEEE N42.17AC, IEC 61526 and IEC 60846-1. PRDs are not intended to
    provide an accurate measurement of exposure (X), personal (Hp(10)) or ambient
    (H*(10)) dose equivalent (rate).The specifications for general, radiological,
    environmental, electromagnetic and mechanical performance are given and the corresponding
    testing methods are described. The documentation to be provided by the manufacturer
    is listed as part of the requirements. A number of informative annexes that provide
    useful information and guidance in implementing this standard are also contained
    in this standard.
