abstract:
- language: en
  script: Latn
  content: Low-strain testing instruments for deep foundations are non-destructive
    testing devices used to evaluate the integrity and continuity of concrete piles
    after installation. They are among the most commonly used tools in pile quality
    assessment. This standard specifies the terms, symbols, basic requirements, and
    technical specifications for low-strain testing instruments. It should also include
    necessary requirements such as hardware requirements, software requirements, vibration
    amplitude linearity, the center frequency and bandwidth of the acceleration measurement
    system, dynamic range, environmental robustness, and electromagnetic compatibility.
    This standard also provides testing methods, inspection procedures, and marking
    for low-strain testing instruments.
