abstract:
- language: en
  script: Latn
  content: 'Qualification methods and criteria to establish the electromagnetic compatibility
    (EMC) of equipment in nuclear power plants and other nuclear facilities are provided
    in this standard. The methods and criteria incorporated in this standard apply
    to electrical and instrumentation and control (I&amp;C) equipment. EMC qualification
    involves the following two elements: a) testing to assess susceptibility of equipment
    to interference levels that bound the expected electromagnetic environment at
    the installation site and b) testing to assess emissions of equipment to help
    ensure that the contribution to the electromagnetic environment does not invalidate
    bounding interference levels applied for susceptibility testing.'
