- language: en
  script: Latn
  content: Superseded by IEEE Std 1147-2005 This Guide is directed to the practicing
    engineer in the field of hydroelectric power plant design for the purpose of providing
    guidance in the decision-making processes and design for rehabilitation of hydroelectric
