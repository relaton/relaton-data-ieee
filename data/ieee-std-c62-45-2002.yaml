abstract:
- language: en
  script: Latn
  content: The scope of this recommended practice is the performance of surge testing
    on electrical and electronic equipment connected to low-voltage ac power circuits,
    specifically using there commended test waveform defined in IEEE Std C62.41.2-2002.
    Nevertheless, these recommendations are applicable to any surge testing, regardless
    of the specific surges that may be applied.
