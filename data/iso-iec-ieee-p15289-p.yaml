abstract:
- language: en
  script: Latn
  content: The purpose and content of systems and software engineering life cycle
    information items (documentation) and data records are specified in this document.
    The information item contents are defined according to generic document types
    (description, plan, policy, procedure, report, request, and specification) and
    the specific purpose of the document. This document provides partial or complete
    outlines for the content of specific documents. Information items may be combined
    or subdivided as needed for project or organizational purposes. It provides a
    cross-reference of the set of information items and records to clauses in ISO/IEC/IEEE
    15288:2023 system engineering life cycle processes and ISO/IEC/IEEE 12207:2026
    software engineering life cycle processes.
