abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.1Q-2011 specifies protocols, procedures,
    and managed objects that enable flow control per traffic class on IEEE 802(R)
    point-to-point full duplex links. This is achieved by a mechanism similar to IEEE
    802.3 Annex 31B PAUSE, but operating on individual priorities.
