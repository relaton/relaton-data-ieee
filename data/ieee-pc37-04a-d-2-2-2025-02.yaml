abstract:
- language: en
  script: Latn
  content: 'Items discovered by users related to discrepancies with other industry
    standards will be addressed by this amendment: Harmonize pollution levels for
    normal service condition, further define requirements for capacitive switching
    class C0, clarify required electrical service capability, improve definition of
    interrupting time, implement requirements from IEEE C37.11 which are more properly
    in C37.04, and align material imported from NEMA SG-4 with current industry practices.'
