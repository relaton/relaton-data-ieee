abstract:
- language: en
  script: Latn
  content: Design process guidance for developing computer-based graphical user interface
    (GUI) displays, including their form and function, is provided. This guidance
    is applicable to GUI display systems provided with new nuclear power generating
    stations and other nuclear facilities, or as digital upgrades to existing facilities,
    including monitoring and control systems. The scope ranges from small modular
    panel inserts limited to single systems through multiple workstations intended
    to monitor and/or control the entire nuclear facility. The guidance applies to
    displays used within or outside of the main control room (MCR). The technical
    details found in IEEE Std 1289 are not covered.
