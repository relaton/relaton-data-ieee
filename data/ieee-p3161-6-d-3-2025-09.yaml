abstract:
- language: en
  script: Latn
  content: This standard defines system framework, functional requirements for data
    management and storage, and interface requirements of the storage system of digital
    retina system (DRS). The standard provides specifications for the design and development
    of related systems. It also supports the collaborative interaction among storage
    services within storage system of DRS.
