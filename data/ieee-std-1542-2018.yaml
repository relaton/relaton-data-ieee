abstract:
- language: en
  script: Latn
  content: Industry practices and guidelines for installation, maintenance, and operation
    of irrigation equipment near or under power lines as they pertain to minimum distance
    to energized conductors and proper grounding to help minimize nuisance shocks
    are presented in this guide. A variety of conditions in general terms is covered
    in this guide. Specific recommendations are made for the type of irrigation systems
    and power line parameters most commonly found.
