abstract:
- language: en
  script: Latn
  content: This amendment to IEEE Std 802.15.4-2006 is limited to defining a new PHY
    and such changes to the MAC as are necessary to support a new frequency allocation
    (950 MHz) in Japan. The amendment shall completely follow the new technical conditions
    described in Japanese ministerial ordinance. The amendment shall coexist with
    passive tag systems in the band.
