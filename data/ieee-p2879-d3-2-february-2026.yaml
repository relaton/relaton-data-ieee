abstract:
- language: en
  script: Latn
  content: This standard specifies the basic terms, assessment requirements, indicator
    systems, and evaluation methods for the evaluation of a smart factory. This standard
    is applicable to smart manufacturing system solution suppliers, users, and other
    enterprises to carry out the overall evaluation and diagnostic enhancement of
    smart factories for factories with actual production processes.
