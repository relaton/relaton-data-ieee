abstract:
- language: en
  script: Latn
  content: 'Seismic design recommendations for substations, including qualification
    of different equipment types are discussed in this amendment. Design recommendations
    consist of seismic criteria, qualification methods and levels, structural capacities,
    performance requirements for equipment operation, installation methods, and documentation.
    Additional files can be found here: https://standards.ieee.org/wp-content/uploads/2025/01/693a-2024_downloads.zip'
