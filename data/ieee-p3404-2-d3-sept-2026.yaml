abstract:
- language: en
  script: Latn
  content: The requirements for a service interface and an information model for the
    resource layer described in IEEE Std 3404™-2025 are specified by this standard,
    which is established to enable data and model sharing across multiple computing
    centers. The resource layer defined in this standard provides foundational resources
    to support such cross-center sharing by offering unified resource abstraction,
    consistent access mechanisms, and interoperable information representations. By
    establishing clear and consistent requirements, this standard aims to enable a
    common understanding of the resource-layer framework, facilitate interoperability
    among heterogeneous computing centers, and provide a foundation for the development
    of subsequent data models, interface protocols, and related technical specifications.
    Three use cases are provided for analyzing the standardization requirements and
    considerations.
