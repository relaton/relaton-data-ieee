abstract:
- language: en
  script: Latn
  content: A knowledge exchange protocol that allows for knowledge fusion among knowledge
    graphs is specified by this standard. The protocol’s framework, modes of knowledge
    exchange, the format of knowledge elements used in knowledge graphs, and the structure
    and processing flow of transmitted messages among knowledge graphs are specified
    by this standard.
