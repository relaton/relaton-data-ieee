- language: en
  script: Latn
  content: IEEE STD 422 provides guidance for the design and installation of cable
    raceway systems for all types of electric generating facilities except for nuclear
    power plants and nuclear facilities, and provides recommendations, methods and
    best engineering practices for the design of cable raceway systems including selection
    of equipment, materials and the configuration of raceway.
