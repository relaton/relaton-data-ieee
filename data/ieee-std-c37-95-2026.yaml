abstract:
- language: en
  script: Latn
  content: Described in this guide are protective relay applications involving electric
    service to consumers that requires a transformation between the utility’s supply
    voltage and the consumer’s utilization voltage. The factors that need to be considered
    in the design of adequate protection facilities, outlines of modern relay practices,
    and several examples of the protection of typical utility-consumer interconnections
    are described.
