abstract:
- language: en
  script: Latn
  content: This standard aims to establish the framework and functional requirements
    for large language models for finance. The framework mainly includes the infrastructure
    layer, platform layer, data layer, model layer, service layer, application layer,
    operation and maintenance layer, and security layer. Through this standard, developers
    and industry stakeholders can help financial institutions identify potential risks
    more accurately and take corresponding measures to control them in time, thus
    improving the efficiency and accuracy of risk management
