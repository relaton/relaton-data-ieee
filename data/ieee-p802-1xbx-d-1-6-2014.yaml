abstract:
- language: en
  script: Latn
  content: This amendment adds MACsec (Media Access Control security) Key Agreement
    protocol (MKA) data elements and procedures that provide additional security and
    manageability capabilities, including the ability to maintain secure communication
    while the operation of MKA is suspended, when used in conjunction with MACsec
    Cipher Suites that support Extended Packet Numbering.
