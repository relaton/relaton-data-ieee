abstract:
- language: en
  script: Latn
  content: The requirements of an identity framework for metaverse is defined in this
    standard. An identity framework for use across different metaverse systems is
    provided. Furthermore, the relevance between real world and virtual world entities
    is recognized. Business logic, operational procedures, and authentication programs
    is covered in this standard. Also, terminologies, a basic architectural framework,
    and key indicators are defined.
