abstract:
- language: en
  script: Latn
  content: 'The supplement to ISO/IEC 8802-3: 1992 [ANSI/IEEE Std 802.3, 1992 Edition]
    defines a set of mechanisms that enable management of ISO/IEC 8802-3 10 Mb/s baseband
    repeater units. The managed objects are defined in accordance with IEEE 802.1
    and ISO/IEC standards for network management.'
