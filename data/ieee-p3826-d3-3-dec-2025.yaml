abstract:
- language: en
  script: Latn
  content: The framework and functional requirements for large language models for
    finance are aimed to be established in this standard. The framework mainly includes
    the infrastructure layer, platform layer, data layer, model layer, service layer,
    application layer, operation and maintenance layer, and security layer. Developers
    and industry stakeholders can help financial institutions identify potential risks
    more accurately and take corresponding measures to control them in time through
    this standard, thus improving the efficiency and accuracy of risk management.
