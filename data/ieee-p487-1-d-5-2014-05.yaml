abstract:
- language: en
  script: Latn
  content: 'Workable methods for protecting wire-line telecommunication circuits entering
    electric supply locations are presented. This document covers: the electric supply
    location environment; protection apparatus; service types, reliability, service
    performance objective classifications, and transmission considerations; protection
    theory and philosophy; protection configurations; installation and inspection;
    and safety.'
