abstract:
- language: en
  script: Latn
  content: Requirements for installation, inspection, and testing of power, instrumentation,
    and control equipment and systems during the construction phase of a nuclear facility
    are set forth. These requirements also cover modifications and those operating
    phase activities that are comparable in nature and extent to related initial construction
    activities of the facility. The intent is to establish requirements for safety
    systems equipment. However, this standard may also be applied to nonsafety systems
    equipment.
