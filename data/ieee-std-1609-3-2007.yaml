abstract:
- language: en
  script: Latn
  content: WAVE Networking Services provides services to WAVE devices and systems.
    It represents roughly layers 3 and 4 of the OSI model and the IP, UDP, and TCP
    elements of the Internet model. The services provided include management and data
    services within WAVE devices.
