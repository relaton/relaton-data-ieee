abstract:
- language: en
  script: Latn
  content: The general requirements, testing, markings, and documentation for impedance
    heating systems for pipes and equipment intended for use in general industrial
    applications are provided in this standard. This standard provides requirements
    when utilizing impedance heating systems in ordinary as well as hazardous areas
    having explosive atmospheres.
