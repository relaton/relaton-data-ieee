abstract:
- language: en
  script: Latn
  content: This standard adopts MPAI AI Framework (MPAI-AIF) Technical Specification
    Version 1.1 as an IEEE Standard. The MPAI-AIF Technical Specification specifies
    architecture, interfaces, protocols, and Application Programming Interfaces (API)
    of an AI Framework (AIF), especially designed for the execution of AI-based implementation,
    but also suitable for mixed AI and traditional data processing workflow.
