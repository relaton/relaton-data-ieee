abstract:
- language: en
  script: Latn
  content: All electric drives, including motors and control wiring associated with
    machinery or equipment commonly used in the manufacturing areas of cement plants
    are covered. Recommendations are not intended to apply to power distribution circuits.
    These recommendations apply to electrical equipment having a supply voltage of
    13 800 V or less.
