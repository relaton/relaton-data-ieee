name: Crawler

on:
  schedule:
  - cron: '37 14 * * *'   # same minute as the shared data-repo template (off minute 0)
  workflow_dispatch:
    inputs:
      args:
        description: Extra args to pass to crawler.rb script
        required: false
        default: ''

jobs:
  crawl:
    # The shared workflow commits and pushes with GITHUB_TOKEN. A called
    # workflow's `permissions:` can only downgrade the caller's, so the grant
    # lives here.
    permissions:
      contents: write
    uses: relaton/support/.github/workflows/crawler.yml@main
    with:
      args: ${{ github.event.inputs.args }}
    # The source, ietf-tools/ieee-rawbib, is private. The shared workflow runs
    # `crawler.rb <args> <secrets.args>`, so this PAT is the script's last
    # argument. Actions masks it in the log.
    secrets:
      args: ${{ secrets.IEEE_RAWBIB_TOKEN }}
